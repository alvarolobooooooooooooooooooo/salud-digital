<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaludDigital — Tutoriales</title>
  <link rel="stylesheet" href="/layout.css">
  <style>
    /* ─────────────────────────────────────────────────────────────────────
       Prefijo `tu-` en TODO y ningún <section>.
       theme-dark.css pisa con !important las clases genéricas de la app
       (.card, .kpi, .field, .modal y todo `section`), así que una pantalla
       nueva que las use sale con colores que no eligió nadie. Los tokens de
       los dos temas se declaran aquí mismo.

       LA FORMA DE LA PANTALLA: dos paneles, UNA guía a la vez.
       La primera versión era una lista de acordeones y enseñaba trece títulos
       con su descripción de golpe: mucha letra junta y nada donde descansar
       la vista. Aquí el índice vive en su carril y el panel derecho enseña
       una sola guía, ocupando todo el ancho disponible. En móvil no caben
       dos paneles, así que se turnan: lista → guía → volver.
       ───────────────────────────────────────────────────────────────────── */

    .tu-page {
      --tu-bg: #f6f8fa;
      --tu-surface: #ffffff;
      --tu-surface-2: #f8fafc;
      --tu-line: #e2e8f0;
      --tu-line-soft: #eef2f6;
      --tu-ink: #0f172a;
      --tu-ink-2: #475569;
      --tu-ink-3: #94a3b8;
      --tu-accent: #0891b2;
      --tu-accent-ink: #0e7490;
      --tu-accent-soft: #ecfeff;
      --tu-accent-line: rgba(8,145,178,.22);
      --tu-warn: #b45309;
      --tu-warn-soft: #fffbeb;
      --tu-warn-line: #fde68a;
      --tu-r: 14px;
      --tu-shadow: 0 1px 2px rgba(15,23,42,.04);

      width: 100%;
      color: var(--tu-ink);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    [data-theme="dark"] .tu-page {
      --tu-bg: #050507;
      --tu-surface: #121214;
      --tu-surface-2: #191a1d;
      --tu-line: rgba(255,255,255,.10);
      --tu-line-soft: rgba(255,255,255,.055);
      --tu-ink: #f1f5f9;
      --tu-ink-2: #cbd5e1;
      --tu-ink-3: #7c8899;
      --tu-accent: #22d3ee;
      --tu-accent-ink: #67e8f9;
      --tu-accent-soft: rgba(34,211,238,.10);
      --tu-accent-line: rgba(34,211,238,.24);
      --tu-warn: #fbbf24;
      --tu-warn-soft: rgba(251,191,36,.09);
      --tu-warn-line: rgba(251,191,36,.28);
      --tu-shadow: none;
    }

    main.layout-main { padding: 22px 26px 44px; }
    @media (max-width: 860px) { main.layout-main { padding: 14px 14px 100px; } }

    .tu-page *, .tu-page *::before, .tu-page *::after { box-sizing: border-box; }

    /* ── Cabecera ── */
    .tu-top { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
    .tu-top h1 {
      margin: 0; font-size: 23px; font-weight: 700; letter-spacing: -.02em;
      display: flex; align-items: center; gap: 10px; color: var(--tu-ink);
    }
    .tu-top h1 svg { color: var(--tu-accent); flex-shrink: 0; }
    .tu-top p { margin: 7px 0 0; color: var(--tu-ink-2); font-size: 13.5px; line-height: 1.6; max-width: 68ch; }
    .tu-top-r { margin-left: auto; }

    .tu-search { position: relative; width: 300px; max-width: 100%; }
    .tu-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--tu-ink-3); }
    .tu-search input {
      width: 100%; height: 40px; padding: 0 34px;
      border: 1px solid var(--tu-line); border-radius: 11px;
      background: var(--tu-surface); color: var(--tu-ink);
      font-family: inherit; font-size: 13.5px; outline: none; transition: border-color .15s;
    }
    .tu-search input:focus { border-color: var(--tu-accent); }
    .tu-search input::placeholder { color: var(--tu-ink-3); }
    .tu-search-clear {
      position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
      width: 25px; height: 25px; display: none; align-items: center; justify-content: center;
      border: 0; border-radius: 7px; background: transparent; color: var(--tu-ink-3); cursor: pointer;
    }
    .tu-search-clear:hover { background: var(--tu-surface-2); color: var(--tu-ink); }
    .tu-search.has-text .tu-search-clear { display: flex; }

    /* ── Los dos paneles: ocupan TODO el ancho de la pantalla ── */
    .tu-shell { display: grid; grid-template-columns: 288px minmax(0, 1fr); gap: 22px; align-items: start; }
    @media (max-width: 1240px) { .tu-shell { grid-template-columns: 252px minmax(0, 1fr); gap: 18px; } }

    /* ── Carril del índice ── */
    .tu-rail {
      position: sticky; top: 16px;
      max-height: calc(100vh - 32px); overflow-y: auto;
      background: var(--tu-surface); border: 1px solid var(--tu-line);
      border-radius: var(--tu-r); padding: 8px; box-shadow: var(--tu-shadow);
    }
    .tu-rail-grupo + .tu-rail-grupo { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--tu-line-soft); }
    .tu-rail-cat {
      display: flex; align-items: center; gap: 8px; padding: 9px 10px 8px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--tu-ink-3);
    }
    .tu-rail-cat svg { color: var(--tu-accent); }
    .tu-rail-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 11px; margin: 2px 0; border: 1px solid transparent; border-radius: 10px;
      background: transparent; color: var(--tu-ink-2);
      font-family: inherit; font-size: 13px; font-weight: 600; text-align: left;
      line-height: 1.4; cursor: pointer; transition: background .14s, color .14s;
    }
    .tu-rail-item:hover { background: var(--tu-surface-2); color: var(--tu-ink); }
    .tu-rail-item.on {
      background: var(--tu-accent-soft); border-color: var(--tu-accent-line);
      color: var(--tu-accent-ink); font-weight: 700;
    }
    .tu-rail-n {
      width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px;
      display: grid; place-items: center;
      background: var(--tu-surface-2); border: 1px solid var(--tu-line);
      font-size: 11px; font-weight: 700; color: var(--tu-ink-3); font-variant-numeric: tabular-nums;
    }
    .tu-rail-item.on .tu-rail-n { background: var(--tu-surface); border-color: var(--tu-accent-line); color: var(--tu-accent-ink); }
    .tu-rail-vacio { padding: 24px 12px; text-align: center; color: var(--tu-ink-3); font-size: 12.5px; line-height: 1.6; }

    /* ── Panel de la guía ── */
    .tu-guia {
      background: var(--tu-surface); border: 1px solid var(--tu-line);
      border-radius: var(--tu-r); box-shadow: var(--tu-shadow);
      padding: 26px 30px 24px;
    }
    @media (max-width: 700px) { .tu-guia { padding: 20px 16px; } }

    .tu-volver {
      display: none; align-items: center; gap: 7px; margin-bottom: 14px;
      padding: 8px 12px; border: 1px solid var(--tu-line); border-radius: 10px;
      background: var(--tu-surface-2); color: var(--tu-ink-2);
      font-family: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
    }

    .tu-eyebrow {
      font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--tu-accent); display: block; margin-bottom: 9px;
    }
    .tu-guia h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.025em; line-height: 1.25; }
    .tu-lead { margin: 10px 0 0; font-size: 14.5px; color: var(--tu-ink-2); line-height: 1.65; max-width: 70ch; }
    .tu-sep { height: 1px; background: var(--tu-line-soft); margin: 22px 0; }

    /* Dos columnas dentro de la guía: los pasos a la izquierda y lo que se
       consulta (plantilla, avisos, enlace) a la derecha. Así el ancho de la
       pantalla se usa de verdad sin que las frases crucen el monitor entero. */
    .tu-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 30px; align-items: start; }
    .tu-cols.solo { grid-template-columns: minmax(0, 1fr); }
    @media (max-width: 1150px) { .tu-cols { grid-template-columns: minmax(0, 1fr); gap: 22px; } }

    .tu-bloque-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--tu-ink-3); margin: 0 0 14px;
    }

    /* ── Capturas señaladas ──
       Las imágenes se generan con tools/shoot-tutoriales.js: son la aplicación
       de verdad, con un círculo numerado sobre el botón de cada paso. Hay una
       por tema porque una captura clara sobre una pantalla oscura (o al revés)
       se lee como un error, no como una foto.

       Se enseñan a ~560px, que es su tamaño natural en CSS: el archivo va al
       doble, así que en pantallas normales entran nítidas. Para el detalle,
       la lupa. */
    .tu-fotos { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; margin: 0 0 26px; }
    .tu-shot {
      flex: 1 1 320px; max-width: 560px; margin: 0;
      border: 1px solid var(--tu-line); border-radius: 12px;
      background: var(--tu-surface-2); overflow: hidden;
    }
    /* Tamaño natural (el archivo va al doble, así que se ve nítida) con tope de
       alto: las ventanas largas de WhatsApp medían el doble que el panel y
       empujaban los pasos fuera de la pantalla. El resto, en la lupa. */
    .tu-shot img {
      display: block; width: auto; max-width: 100%; max-height: 620px;
      height: auto; margin: 0 auto; cursor: zoom-in;
    }
    .tu-shot figcaption {
      padding: 10px 13px; font-size: 12.25px; color: var(--tu-ink-2);
      line-height: 1.55; border-top: 1px solid var(--tu-line-soft);
    }
    /* Con `img` en el selector: `.tu-shot img { display:block }` de arriba tiene
       más peso que una clase suelta y salían las dos versiones a la vez. */
    .tu-shot img.tu-shot-oscuro { display: none; }
    [data-theme="dark"] .tu-shot img.tu-shot-claro { display: none; }
    [data-theme="dark"] .tu-shot img.tu-shot-oscuro { display: block; }

    .tu-lupa {
      position: fixed; inset: 0; z-index: 4000; display: none;
      align-items: center; justify-content: center; padding: 28px;
      background: rgba(2,6,23,.82); backdrop-filter: blur(3px);
    }
    .tu-lupa[open] { display: flex; }
    .tu-lupa img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
    .tu-lupa-x {
      position: absolute; top: 18px; right: 20px; width: 40px; height: 40px;
      display: grid; place-items: center; cursor: pointer;
      border: 1px solid rgba(255,255,255,.25); border-radius: 11px;
      background: rgba(255,255,255,.10); color: #fff;
    }

    /* ── Pasos ── */
    .tu-steps { list-style: none; margin: 0; padding: 0; }
    .tu-step { display: flex; gap: 14px; padding-bottom: 22px; position: relative; }
    .tu-step:last-child { padding-bottom: 0; }
    .tu-step:not(:last-child)::before {
      content: ''; position: absolute; left: 13px; top: 30px; bottom: 4px;
      width: 1px; background: var(--tu-line);
    }
    .tu-step-n {
      width: 27px; height: 27px; flex-shrink: 0; border-radius: 50%;
      display: grid; place-items: center; z-index: 1;
      background: var(--tu-accent-soft); border: 1px solid var(--tu-accent-line);
      color: var(--tu-accent-ink); font-size: 12px; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .tu-step-txt { padding-top: 3px; min-width: 0; max-width: 74ch; }
    .tu-step-txt > b { display: block; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.4; }
    .tu-step-txt p { margin: 6px 0 0; font-size: 13.5px; color: var(--tu-ink-2); line-height: 1.7; }

    /* Nombre literal de un botón o pestaña de la app. */
    .tu-ui { font-weight: 650; color: var(--tu-ink); }
    .tu-var {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em;
      color: var(--tu-accent-ink); background: var(--tu-accent-soft);
      border-radius: 5px; padding: 1px 5px; white-space: nowrap;
    }

    /* ── Avisos ── */
    .tu-notes { display: flex; flex-direction: column; gap: 10px; }
    .tu-note {
      display: flex; gap: 10px; padding: 13px 14px; border-radius: 12px;
      background: var(--tu-surface-2); border: 1px solid var(--tu-line-soft);
      font-size: 13px; color: var(--tu-ink-2); line-height: 1.65;
    }
    .tu-note svg { flex-shrink: 0; margin-top: 2px; color: var(--tu-ink-3); }
    .tu-note.ojo { background: var(--tu-warn-soft); border-color: var(--tu-warn-line); }
    .tu-note.ojo svg { color: var(--tu-warn); }

    /* ── Plantilla de ejemplo ── */
    .tu-tpl { border: 1px solid var(--tu-line); border-radius: 12px; background: var(--tu-surface-2); overflow: hidden; }
    .tu-tpl + .tu-notes, .tu-notes + .tu-tpl { margin-top: 16px; }
    .tu-tpl-h {
      display: flex; align-items: center; gap: 8px; padding: 10px 13px;
      border-bottom: 1px solid var(--tu-line-soft);
      font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--tu-ink-3);
    }
    .tu-copy {
      margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--tu-line); border-radius: 8px; background: var(--tu-surface);
      color: var(--tu-ink-2); font-family: inherit; font-size: 11px; font-weight: 650;
      letter-spacing: 0; text-transform: none; padding: 5px 9px; cursor: pointer;
    }
    .tu-copy:hover { color: var(--tu-ink); border-color: var(--tu-ink-3); }
    .tu-copy.ok { color: var(--tu-accent-ink); border-color: var(--tu-accent-line); background: var(--tu-accent-soft); }
    .tu-tpl pre {
      margin: 0; padding: 14px; font-size: 12.5px; line-height: 1.85;
      white-space: pre-wrap; word-break: break-word; color: var(--tu-ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* ── Tabla ── */
    .tu-scroll { overflow-x: auto; border: 1px solid var(--tu-line); border-radius: 12px; }
    .tu-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
    .tu-table th {
      text-align: left; padding: 11px 13px; background: var(--tu-surface-2);
      font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      color: var(--tu-ink-3); border-bottom: 1px solid var(--tu-line); white-space: nowrap;
    }
    .tu-table td { padding: 11px 13px; border-bottom: 1px solid var(--tu-line-soft); color: var(--tu-ink-2); vertical-align: top; line-height: 1.55; }
    .tu-table tr:last-child td { border-bottom: 0; }
    .tu-table td.si { color: var(--tu-accent); text-align: center; }
    .tu-table td.no { color: var(--tu-ink-3); text-align: center; }
    .tu-table th.c { text-align: center; }

    /* ── Enlace a la pantalla ── */
    .tu-go {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 15px; border-radius: 11px; text-decoration: none;
      border: 1px solid var(--tu-accent-line); background: var(--tu-accent-soft);
      color: var(--tu-accent-ink); font-size: 13px; font-weight: 650;
    }
    .tu-go:hover { border-color: var(--tu-accent); }

    /* ── Anterior / siguiente ── */
    .tu-pager { display: flex; gap: 12px; margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--tu-line-soft); }
    .tu-pager button {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px;
      padding: 12px 14px; border: 1px solid var(--tu-line); border-radius: 12px;
      background: var(--tu-surface); color: var(--tu-ink); font-family: inherit;
      text-align: left; cursor: pointer; transition: border-color .15s;
    }
    .tu-pager button:hover { border-color: var(--tu-accent-line); }
    .tu-pager button[hidden] { display: none; }
    .tu-pager .sig { justify-content: flex-end; text-align: right; }
    .tu-pager small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tu-ink-3); margin-bottom: 3px; }
    .tu-pager span { font-size: 13px; font-weight: 650; line-height: 1.35; }
    .tu-pager svg { flex-shrink: 0; color: var(--tu-ink-3); }

    /* ── Móvil: los paneles se turnan ── */
    @media (max-width: 1000px) {
      .tu-shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
      .tu-rail { position: static; max-height: none; }
      .tu-volver { display: inline-flex; }
      .tu-page[data-vista="lista"] .tu-guia { display: none; }
      .tu-page[data-vista="guia"] .tu-rail { display: none; }
      .tu-top-r { margin-left: 0; width: 100%; }
      .tu-search { width: 100%; }
      .tu-page[data-vista="guia"] .tu-top-r { display: none; }
    }
  </style>
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="page-loader-content">
    <div class="page-loader-spinner"></div>
    <div class="page-loader-text">Cargando...</div>
  </div>
</div>

<main class="layout-main">
  <!-- data-sd-gate="off": aquí no se guarda nada, así que el modo solo lectura
       no tiene por qué apagar los botones de copiar ni los enlaces. -->
  <div class="tu-page" id="tuPage" data-sd-gate="off" data-vista="lista">

    <div class="tu-top">
      <div>
        <h1>
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2H2z"/><path d="M22 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2H22z"/></svg>
          Tutoriales
        </h1>
        <p>Elige una guía en la lista y se abre aquí, paso por paso: dónde tocar, qué escribir y qué se rompe si falta algo.</p>
      </div>
      <div class="tu-top-r">
        <div class="tu-search" id="tuSearchWrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="tuSearch" placeholder="Buscar en los tutoriales…" autocomplete="off" spellcheck="false">
          <button class="tu-search-clear" id="tuSearchClear" type="button" aria-label="Limpiar búsqueda">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="tu-shell">
      <div class="tu-rail" id="tuRail"></div>
      <div class="tu-guia" id="tuGuia"></div>
    </div>

  </div>

  <div class="tu-lupa" id="tuLupa" role="dialog" aria-label="Captura ampliada">
    <button type="button" class="tu-lupa-x" id="tuLupaX" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <img id="tuLupaImg" alt="">
  </div>
</main>

<script src="/icons.js"></script>
<script src="/common.js"></script>
<script src="/layout.js"></script>
<script>
'use strict';
requireAuth(['doctor', 'clinic_admin', 'receptionist']);

/* ───────────────────────────────────────────────────────────────────────────
   EL CONTENIDO VIVE AQUÍ, EN UN SOLO SITIO.

   Todo lo que se ve en pantalla —índice, títulos, buscador— se pinta desde
   este array. Para añadir una guía nueva no hay que tocar ni el HTML ni el
   CSS: se mete un objeto más en `items` de su categoría.

   Forma de una guía:
     id       — ancla de la URL (#crear-paciente). No cambiarlo una vez
                publicado: la gente comparte estos enlaces.
     titulo   — el título de la guía, y lo que se lee en el índice.
     resumen  — una línea de entrada, debajo del título.
     roles    — quién ve la guía. Si se omite, la ven todos. Es importante:
                una recepcionista no tiene /patients.html y enseñarle esa ruta
                es mandarla a una pantalla que la rebota.
     pasos    — [{ t: título del paso, d: explicación }]
     notas    — [{ tipo: 'tip' | 'ojo', txt }]
     plantilla— { titulo, texto } bloque copiable (mensajes de WhatsApp)
     tabla    — { cols, filas } para lo que se lee mejor en rejilla
     ir       — { href, label } enlace a la pantalla de la que habla la guía

   En los textos:
     **negrita**      → negrita
     «Guardar»        → nombre literal de un botón/pestaña de la app
     {{paciente}}  → dato de plantilla, se pinta como etiqueta
   ─────────────────────────────────────────────────────────────────────────── */

const GUIAS = [
  {
    id: 'pacientes',
    titulo: 'Pacientes',
    icono: 'users',
    resumen: 'Dar de alta a la persona, encontrarla después y completar lo que falte. Todo lo demás —citas, consultas, recordatorios— cuelga de esta ficha.',
    items: [
      {
        id: 'crear-paciente',
        titulo: 'Crear un paciente nuevo',
        resumen: 'El camino normal, desde la pantalla de Pacientes.',
        fotos: [
          { img: 'crear-paciente-boton', pie: 'El botón «+» vive arriba de la cola de pacientes (paso 2).' },

/* ── Pintado ─────────────────────────────────────────────────────────────── */

const rol = (typeof getRole === 'function' ? getRole() : localStorage.getItem('sd_role')) || '';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Mini-formato del contenido: escapa primero (el texto es plano) y después
// convierte las tres marcas que se usan al escribir las guías.
function fmt(s) {
  return esc(s)
    .replace(/\{\{([^{}]+)\}\}/g, '<span class="tu-var">{{$1}}</span>')  // [^{}] y no \w: los nombres llevan tildes
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/«([^»]+)»/g, '<span class="tu-ui">«$1»</span>');
}

function normalizar(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

  tip: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
  ojo: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  copy: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  der: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  izq: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>'
};

// Las guías que este rol puede ver, en orden y ya aplanadas: el índice, el
// buscador y el anterior/siguiente trabajan todos sobre esta misma lista.
const LISTA = [];
GUIAS.forEach(cat => {
  cat.items.filter(it => !it.roles || it.roles.includes(rol)).forEach((it, i) => {
    LISTA.push(Object.assign({}, it, { catId: cat.id, catTitulo: cat.titulo, catIcono: cat.icono }));
  });
});

// Texto completo de cada guía para el buscador: quien busca "identidad" o
// "mapa" no sabe en qué guía está eso, y ese es justo el problema que el
// buscador viene a resolver.
const TEXTO = {};
LISTA.forEach(it => {
  TEXTO[it.id] = normalizar([
    it.titulo, it.resumen, it.catTitulo,
    (it.pasos || []).map(p => p.t + ' ' + (p.d || '')).join(' '),
    (it.notas || []).map(n => n.txt).join(' '),
    it.plantilla ? it.plantilla.texto : '',
    it.tabla ? it.tabla.filas.map(f => f[0] + ' ' + f[1]).join(' ') : ''
  ].join(' '));
});

function esMovil() { return window.matchMedia('(max-width: 1000px)').matches; }

const page = document.getElementById('tuPage');
const rail = document.getElementById('tuRail');
const panel = document.getElementById('tuGuia');
const inputBuscar = document.getElementById('tuSearch');
const wrapBuscar = document.getElementById('tuSearchWrap');

let actual = LISTA.length ? LISTA[0].id : null;

/* ── Índice ── */

function pintarRail() {
  const q = normalizar(inputBuscar.value.trim());
  const vistos = LISTA.filter(it => !q || (TEXTO[it.id] || '').includes(q));

  if (!vistos.length) {
    rail.innerHTML = '<div class="tu-rail-vacio">No hay ninguna guía que hable de eso.<br>Prueba con otra palabra.</div>';
    return;
  }

  // En móvil la lista y la guía se turnan: mientras se ve la LISTA no hay
  // ninguna guía abierta, así que marcar una sería mentir. En escritorio el
  // panel derecho siempre enseña una, y ahí la marca sí corresponde.
  const marcar = !esMovil() || page.getAttribute('data-vista') === 'guia';

  let html = '';
  let catActual = null;
  vistos.forEach(it => {
    if (it.catId !== catActual) {
      if (catActual !== null) html += '</div>';
      html += `<div class="tu-rail-grupo">
        <div class="tu-rail-cat">${typeof Icons !== 'undefined' ? Icons.render(it.catIcono, 14) : ''}${esc(it.catTitulo)}</div>`;
      catActual = it.catId;
    }
    const n = LISTA.filter(x => x.catId === it.catId).indexOf(it) + 1;
    html += `<button type="button" class="tu-rail-item ${marcar && it.id === actual ? 'on' : ''}" data-guia="${esc(it.id)}">
      <span class="tu-rail-n">${n}</span>
      <span>${esc(it.titulo)}</span>
    </button>`;
  });
  html += '</div>';
  rail.innerHTML = html;
}

/* ── Guía ── */

function pintarPasos(pasos) {
  return '<ol class="tu-steps">' + pasos.map((p, i) => `
    <li class="tu-step">
      <span class="tu-step-n">${i + 1}</span>
      <div class="tu-step-txt">
        <b>${fmt(p.t)}</b>
        ${p.d ? `<p>${fmt(p.d)}</p>` : ''}
      </div>
    </li>`).join('') + '</ol>';
}

function pintarFotos(fotos) {
  if (!fotos || !fotos.length) return '';
  return '<div class="tu-fotos">' + fotos.map(f => `
    <figure class="tu-shot">
      <img class="tu-shot-claro" src="/tutoriales/${esc(f.img)}-claro.webp" alt="${esc(f.pie)}" loading="lazy">
      <img class="tu-shot-oscuro" src="/tutoriales/${esc(f.img)}-oscuro.webp" alt="${esc(f.pie)}" loading="lazy">
      <figcaption>${fmt(f.pie)}</figcaption>
    </figure>`).join('') + '</div>';
}

function pintarNotas(notas) {
  if (!notas || !notas.length) return '';
  return '<div class="tu-notes">' + notas.map(n => `
    <div class="tu-note ${n.tipo === 'ojo' ? 'ojo' : ''}">${ICO[n.tipo] || ICO.tip}<div>${fmt(n.txt)}</div></div>`).join('') + '</div>';
}

function pintarPlantilla(tpl) {
  if (!tpl) return '';
  return `
    <div class="tu-tpl">
      <div class="tu-tpl-h">
        ${esc(tpl.titulo)}
        <button type="button" class="tu-copy" data-copiar="${esc(tpl.texto).replace(/\n/g, '&#10;')}">${ICO.copy}<span>Copiar</span></button>
      </div>
      <pre>${fmt(tpl.texto)}</pre>
    </div>`;
}

function pintarTabla(t) {
  if (!t) return '';
  const cabeceras = t.cols.map((c, i) => `<th${i >= 2 ? ' class="c"' : ''}>${esc(c)}</th>`).join('');
  const filas = t.filas.map(f => '<tr>' + f.map((celda, i) => {
    if (i >= 2) return celda ? '<td class="si">●</td>' : '<td class="no">—</td>';
    return `<td>${fmt(celda)}</td>`;
  }).join('') + '</tr>').join('');
  return `<div class="tu-scroll"><table class="tu-table"><thead><tr>${cabeceras}</tr></thead><tbody>${filas}</tbody></table></div>`;
}

function pintarGuia(id) {
  const i = LISTA.findIndex(x => x.id === id);
  if (i < 0) return;
  const g = LISTA[i];
  const hermanas = LISTA.filter(x => x.catId === g.catId);
  const n = hermanas.indexOf(g) + 1;

  // La columna derecha existe solo si hay algo que consultar; si no, los pasos
  // se quedan con todo el ancho en vez de dejar medio panel en blanco.
  const lateral = pintarPlantilla(g.plantilla) + pintarNotas(g.notas) +
    (g.ir ? `<a class="tu-go" href="${esc(g.ir.href)}" style="margin-top:16px">${esc(g.ir.label)} ${ICO.der}</a>` : '');

  const ant = LISTA[i - 1], sig = LISTA[i + 1];

  panel.innerHTML = `
    <button type="button" class="tu-volver" id="tuVolver">${ICO.izq} Todas las guías</button>
    <span class="tu-eyebrow">${esc(g.catTitulo)} · Guía ${n} de ${hermanas.length}</span>
    <h2>${fmt(g.titulo)}</h2>
    <p class="tu-lead">${fmt(g.resumen)}</p>
    <div class="tu-sep"></div>
    ${pintarFotos(g.fotos)}
    <div class="tu-cols ${lateral.trim() ? '' : 'solo'}">
      <div>
        <p class="tu-bloque-label">Paso a paso</p>
        ${pintarPasos(g.pasos)}
      </div>
      ${lateral.trim() ? `<div>${lateral}</div>` : ''}
    </div>
    ${g.tabla ? `<div class="tu-sep"></div><p class="tu-bloque-label">Dato por dato</p>${pintarTabla(g.tabla)}` : ''}
    <div class="tu-pager">
      <button type="button" class="ant" ${ant ? `data-guia="${esc(ant.id)}"` : 'hidden'}>
        ${ICO.izq}<span style="min-width:0"><small>Anterior</small><span>${ant ? esc(ant.titulo) : ''}</span></span>
      </button>
      <button type="button" class="sig" ${sig ? `data-guia="${esc(sig.id)}"` : 'hidden'}>
        <span style="min-width:0"><small>Siguiente</small><span>${sig ? esc(sig.titulo) : ''}</span></span>${ICO.der}
      </button>
    </div>`;
}

function seleccionar(id, opciones) {
  if (!LISTA.some(x => x.id === id)) return;
  actual = id;
  pintarGuia(id);
  pintarRail();
  history.replaceState(null, '', '#' + id);
  page.setAttribute('data-vista', 'guia');
  if (!opciones || opciones.scroll !== false) {
    // En móvil el panel sustituye a la lista: hay que volver arriba o la guía
    // nueva empieza por donde se quedó la anterior.
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* ── Arranque ── */

const inicial = location.hash.slice(1);
if (LISTA.some(x => x.id === inicial)) {
  actual = inicial;
  page.setAttribute('data-vista', 'guia');
}
pintarRail();
if (actual) pintarGuia(actual);

/* ── Interacción ── */

rail.addEventListener('click', e => {
  const b = e.target.closest('.tu-rail-item');
  if (b) seleccionar(b.getAttribute('data-guia'));
});

panel.addEventListener('click', e => {
  const nav = e.target.closest('.tu-pager button[data-guia]');
  if (nav) { seleccionar(nav.getAttribute('data-guia')); return; }
  if (e.target.closest('#tuVolver')) {
    page.setAttribute('data-vista', 'lista');
    pintarRail();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

inputBuscar.addEventListener('input', () => {
  wrapBuscar.classList.toggle('has-text', inputBuscar.value.trim().length > 0);
  pintarRail();
  // Buscar es buscar en la lista: la guía abierta no se cambia sola bajo los
  // dedos de nadie, se cambia cuando se elige una de los resultados.
  if (esMovil()) page.setAttribute('data-vista', 'lista');
});

document.getElementById('tuSearchClear').addEventListener('click', () => {
  inputBuscar.value = '';
  wrapBuscar.classList.remove('has-text');
  pintarRail();
  inputBuscar.focus();
});

/* ── Ampliar una captura ─────────────────────────────────────────────────── */

const lupa = document.getElementById('tuLupa');
const lupaImg = document.getElementById('tuLupaImg');

document.addEventListener('click', e => {
  const img = e.target.closest('.tu-shot img');
  if (img) {
    lupaImg.src = img.currentSrc || img.src;
    lupaImg.alt = img.alt;
    lupa.setAttribute('open', '');
    return;
  }
  if (e.target.closest('#tuLupaX') || e.target === lupa) lupa.removeAttribute('open');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && lupa.hasAttribute('open')) lupa.removeAttribute('open');
});

/* ── Copiar plantilla ────────────────────────────────────────────────────── */

document.addEventListener('click', async e => {
  const btn = e.target.closest('.tu-copy');
  if (!btn) return;
  e.preventDefault();
  const texto = btn.getAttribute('data-copiar') || '';
  let ok = false;
  try {
    await navigator.clipboard.writeText(texto);
    ok = true;
  } catch (err) {
    // Sin permiso de portapapeles (o sin HTTPS): el textarea oculto sigue
    // funcionando en los navegadores donde la API moderna no está.
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
  }
  const etiqueta = btn.querySelector('span');
  etiqueta.textContent = ok ? 'Copiado' : 'No se pudo';
  btn.classList.toggle('ok', ok);
  setTimeout(() => { etiqueta.textContent = 'Copiar'; btn.classList.remove('ok'); }, 1800);
});

const pl = document.getElementById('pageLoader');
if (pl) pl.classList.add('hidden');
</script>
