<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Confirmación de cita · SaludDigital</title>
<meta name="theme-color" content="#0891b2">
<link rel="icon" href="data:,">
<style>
  :root{
    /* La clínica pisa --brand con su color; todo el degradado de la cabecera
       se calcula a partir de él, así un solo color sigue dando cristal. */
    --brand:#0891b2;
    --green-400:#34d399; --green-500:#10b981; --green-600:#059669; --green-700:#047857;
    --rose-500:#f43f5e; --rose-600:#e11d48; --rose-700:#be123c;

    --ink:#0f172a; --ink-2:#334155; --ink-3:#64748b; --ink-4:#94a3b8;

    /* Cristal: blancos translúcidos + la línea de canto que hace el borde de vidrio */
    --glass:rgba(255,255,255,.62);
    --glass-strong:rgba(255,255,255,.80);
    --glass-line:rgba(255,255,255,.80);
    --hairline:rgba(15,23,42,.09);
    --blur:saturate(185%) blur(26px);

    --shadow-card:
      0 44px 84px -30px rgba(8,47,73,.34),
      0 18px 44px -22px rgba(8,47,73,.22),
      0 2px 6px rgba(8,47,73,.05);

    --r-lg:28px; --r-md:20px; --r-sm:14px;

    /* location.js pinta su bloque con estas variables: aquí se le da cristal */
    --sdloc-bg:rgba(255,255,255,.46);
    --sdloc-line:rgba(255,255,255,.85);
    --sdloc-ink:#0f172a;
    --sdloc-muted:#64748b;
  }

  *{ box-sizing:border-box }
  html, body{ margin:0; padding:0; min-height:100% }
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:
      calc(28px + env(safe-area-inset-top, 0px))
      calc(16px + env(safe-area-inset-right, 0px))
      calc(28px + env(safe-area-inset-bottom, 0px))
      calc(16px + env(safe-area-inset-left, 0px));
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 800px at 50% 108%, #ffffff 0%, #eef8fc 55%, #e6eef6 100%);
  }

  /* ---- Fondo: dos capas de manchas de color muy suaves. Son degradados
     radiales (no filter:blur), así que el cristal tiene algo que refractar
     sin pagar un desenfoque por fotograma. ---- */
  .bg, .bg-2{
    position:fixed; inset:-25%; z-index:-1; pointer-events:none;
    will-change:transform;
  }
  .bg{
    background-image:
      radial-gradient(46% 34% at 30% 22%, rgba(34,211,238,.62), transparent 72%),
      radial-gradient(40% 30% at 74% 16%, rgba(129,140,248,.46), transparent 72%),
      radial-gradient(50% 40% at 68% 78%, rgba(45,212,191,.54), transparent 72%),
      radial-gradient(42% 34% at 24% 82%, rgba(244,186,222,.46), transparent 72%);
    animation:deriva 38s ease-in-out infinite alternate;
  }
  .bg-2{
    background-image:
      radial-gradient(44% 32% at 52% 44%, rgba(56,189,248,.44), transparent 72%),
      radial-gradient(40% 34% at 44% 66%, rgba(167,243,208,.50), transparent 72%),
      radial-gradient(34% 26% at 58% 8%, rgba(196,181,253,.38), transparent 72%);
    animation:deriva-2 52s ease-in-out infinite alternate;
  }
  @keyframes deriva{
    from{ transform:translate3d(0,0,0) scale(1) }
    to  { transform:translate3d(-4%, 3%, 0) scale(1.12) }
  }
  @keyframes deriva-2{
    from{ transform:translate3d(0,0,0) scale(1.08) }
    to  { transform:translate3d(5%, -4%, 0) scale(1) }
  }

  /* ---- La tarjeta de cristal ---- */
  .card{
    position:relative;
    width:100%; max-width:480px;
    margin:auto;
    border-radius:var(--r-lg);
    background:linear-gradient(152deg,
      rgba(255,255,255,.70) 0%,
      rgba(255,255,255,.44) 46%,
      rgba(255,255,255,.62) 100%);
    -webkit-backdrop-filter:var(--blur);
    backdrop-filter:var(--blur);
    border:1px solid var(--glass-line);
    box-shadow:
      var(--shadow-card),
      0 50px 90px -46px rgba(6,182,212,.55),
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -1px 0 rgba(255,255,255,.40),
      inset 1px 0 0 rgba(255,255,255,.55),
      inset -1px 0 0 rgba(255,255,255,.55);
    overflow:hidden;
    animation:entrar .6s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes entrar{
    from{ opacity:0; transform:translateY(18px) scale(.985) }
    to  { opacity:1; transform:none }
  }

  /* ---- Cabecera: degradado hecho con un solo color de marca ---- */
  .head{
    position:relative;
    padding:30px 28px 22px;
    text-align:center; color:#fff;
    background:var(--brand);
    background-image:linear-gradient(138deg,
      color-mix(in srgb, var(--brand) 66%, #ffffff) 0%,
      var(--brand) 44%,
      color-mix(in srgb, var(--brand) 74%, #082f3f) 100%);
    box-shadow:inset 0 -1px 0 rgba(255,255,255,.28);
    overflow:hidden;
    isolation:isolate;
  }
  /* Luz difusa arriba a la izquierda */
  .head::before{
    content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(70% 90% at 18% -10%, rgba(255,255,255,.42), transparent 62%);
  }
  /* Reflejo diagonal: el brillo que delata que hay vidrio */
  .head::after{
    content:''; position:absolute; z-index:-1; pointer-events:none;
    left:-25%; top:-130%; width:62%; height:320%;
    transform:rotate(19deg);
    background:linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.26) 48%,
      rgba(255,255,255,0) 100%);
  }
  .head h1{
    margin:12px 0 4px;
    font-size:22px; font-weight:700; letter-spacing:-0.015em;
    text-shadow:0 1px 12px rgba(8,47,73,.22);
  }
  .head .sub{
    margin:0; font-size:13.5px; font-weight:500;
    color:rgba(255,255,255,.92);
  }
  .head .logo{
    width:54px; height:54px; border-radius:18px;
    display:inline-flex; align-items:center; justify-content:center;
    background:linear-gradient(158deg, rgba(255,255,255,.46), rgba(255,255,255,.14));
    border:1px solid rgba(255,255,255,.48);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.72),
      0 12px 24px -14px rgba(4,30,45,.7);
  }

  .body{ padding:26px 26px 28px; position:relative }

  /* ---- Panel de datos: cristal sobre cristal ---- */
  .info-block{
    background:linear-gradient(160deg, rgba(255,255,255,.72), rgba(255,255,255,.36));
    border:1px solid rgba(255,255,255,.9);
    border-radius:var(--r-md);
    -webkit-backdrop-filter:saturate(150%) blur(12px);
    backdrop-filter:saturate(150%) blur(12px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      0 12px 26px -18px rgba(8,47,73,.45);
    padding:16px 18px;
    margin-bottom:18px;
  }
  .info-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:9px 0; gap:12px; font-size:14px;
  }
  .info-row + .info-row{ border-top:1px solid var(--hairline) }
  .info-row .k{
    color:var(--ink-3); font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.08em;
    flex-shrink:0; padding-top:2px;
  }
  .info-row .v{
    color:var(--ink); font-weight:600; text-align:right;
    font-size:14px; line-height:1.4;
  }

  /* ---- Botones ---- */
  .actions{ display:flex; flex-direction:column; gap:11px; margin-top:6px }
  .btn{
    position:relative; overflow:hidden;
    width:100%; padding:15px 18px;
    border-radius:16px; border:none; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s, filter .18s;
  }
  /* Barniz superior: media pastilla de luz sobre el color */
  .btn::before{
    content:''; position:absolute; left:0; right:0; top:0; height:52%;
    background:linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,0));
    pointer-events:none;
  }
  .btn:disabled{ opacity:.5; cursor:not-allowed; transform:none !important }
  .btn-primary{
    background:linear-gradient(138deg, var(--green-400), var(--green-500) 46%, var(--green-600));
    color:#fff;
    box-shadow:
      0 14px 28px -12px rgba(5,150,105,.72),
      0 2px 6px -2px rgba(5,150,105,.4),
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -1px 0 rgba(4,120,87,.5);
  }
  .btn-primary:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:
      0 20px 34px -12px rgba(5,150,105,.8),
      0 3px 8px -2px rgba(5,150,105,.45),
      inset 0 1px 0 rgba(255,255,255,.55);
  }
  .btn-primary:active:not(:disabled){ transform:translateY(0) }
  .btn-secondary{
    background:linear-gradient(160deg, rgba(255,255,255,.82), rgba(255,255,255,.52));
    color:var(--rose-700);
    border:1px solid rgba(244,63,94,.36);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      0 10px 22px -16px rgba(190,18,60,.55);
  }
  .btn-secondary:hover:not(:disabled){
    transform:translateY(-2px);
    border-color:rgba(225,29,72,.55);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      0 16px 26px -16px rgba(190,18,60,.6);
  }
  .btn-secondary:active:not(:disabled){ transform:translateY(0) }

  /* ---- Pie ---- */
  .clinic-foot{
    text-align:center; padding:16px 26px 20px;
    border-top:1px solid rgba(255,255,255,.75);
    background:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.62));
    color:var(--ink-3);
    font-size:12.5px;
  }
  .clinic-foot b{ color:var(--ink-2); font-weight:600 }
  .clinic-foot a{
    color:color-mix(in srgb, var(--brand) 82%, #0f172a);
    text-decoration:none; font-weight:600;
  }

  /* ---- Estados ---- */
  .state-icon{
    width:76px; height:76px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin:6px auto 16px; flex-shrink:0;
    position:relative;
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .state-icon::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:linear-gradient(160deg, rgba(255,255,255,.6), rgba(255,255,255,0) 55%);
    pointer-events:none;
  }
  @keyframes pop{
    from{ opacity:0; transform:scale(.7) }
    to  { opacity:1; transform:none }
  }
  .state-icon.ok{
    background:linear-gradient(150deg, rgba(209,250,229,.95), rgba(110,231,183,.55));
    border:1px solid rgba(255,255,255,.9);
    color:var(--green-700);
    box-shadow:0 18px 34px -18px rgba(5,150,105,.75), inset 0 1px 0 rgba(255,255,255,.95);
  }
  .state-icon.bad{
    background:linear-gradient(150deg, rgba(255,228,230,.95), rgba(253,164,175,.55));
    border:1px solid rgba(255,255,255,.9);
    color:var(--rose-700);
    box-shadow:0 18px 34px -18px rgba(190,18,60,.6), inset 0 1px 0 rgba(255,255,255,.95);
  }
  .state-icon.warn{
    background:linear-gradient(150deg, rgba(254,249,195,.95), rgba(253,224,71,.5));
    border:1px solid rgba(255,255,255,.9);
    color:#854d0e;
    box-shadow:0 18px 34px -18px rgba(161,98,7,.55), inset 0 1px 0 rgba(255,255,255,.95);
  }
  .center{ text-align:center }
  .center h2{
    font-size:21px; font-weight:700; letter-spacing:-0.018em;
    margin:0 0 8px;
  }
  .center p{
    margin:0; color:var(--ink-2); font-size:14px; line-height:1.6;
  }
  .spinner{
    width:38px; height:38px; border-radius:50%;
    border:3px solid rgba(255,255,255,.75);
    border-top-color:var(--brand);
    box-shadow:0 6px 16px -8px rgba(8,47,73,.4);
    animation:sp .8s linear infinite;
    margin:28px auto;
  }
  @keyframes sp{ to{ transform:rotate(360deg) } }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 11px; border-radius:999px;
    font-size:12px; font-weight:600;
    border:1px solid rgba(255,255,255,.8);
  }
  .pill.confirmed{ background:rgba(220,252,231,.8); color:var(--green-700) }
  .pill.declined{ background:rgba(255,228,230,.8); color:var(--rose-700) }
  .pill.sent{ background:rgba(254,249,195,.8); color:#854d0e }
  .change-link{
    display:inline-block; margin-top:16px;
    padding:9px 16px; border-radius:999px;
    color:color-mix(in srgb, var(--brand) 80%, #0f172a);
    font-family:inherit; font-weight:600; font-size:13px;
    cursor:pointer;
    background:linear-gradient(160deg, rgba(255,255,255,.8), rgba(255,255,255,.45));
    border:1px solid rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 8px 20px -14px rgba(8,47,73,.5);
    transition:transform .18s, box-shadow .18s;
  }
  .change-link:hover{
    transform:translateY(-1px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 12px 22px -14px rgba(8,47,73,.55);
  }

  /* El bloque de ubicación (.sdloc) trae sus propios estilos desde location.js;
     aquí se le da su sitio y el mismo cristal que el resto de la tarjeta. */
  .sdloc{
    margin:16px 0 18px;
    -webkit-backdrop-filter:saturate(150%) blur(12px);
    backdrop-filter:saturate(150%) blur(12px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 12px 26px -18px rgba(8,47,73,.45);
  }

  /* Sin backdrop-filter (navegadores viejos) el cristal se vuelve blanco sólido
     en vez de dejar el texto flotando sobre las manchas de color. */
  @supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
    .card{ background:rgba(255,255,255,.96) }
    .info-block, .btn-secondary, .change-link{ background:#fff }
    .sdloc{ background:#fff }
  }

  @media (prefers-reduced-motion: reduce){
    .bg, .bg-2{ animation:none }
    .card, .state-icon{ animation:none }
    .btn:hover, .change-link:hover{ transform:none }
  }

  @media (max-width: 420px){
    body{
      padding:
        calc(16px + env(safe-area-inset-top, 0px))
        calc(12px + env(safe-area-inset-right, 0px))
        calc(16px + env(safe-area-inset-bottom, 0px))
        calc(12px + env(safe-area-inset-left, 0px));
    }
    .card{ border-radius:24px }
    .head{ padding:24px 20px 18px }
    .body{ padding:22px 20px 24px }
    .head h1{ font-size:20px }
    .head .logo{ width:48px; height:48px; border-radius:16px }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-2" aria-hidden="true"></div>

  <div class="card" role="region" aria-labelledby="hdrTitle">
    <div id="state">
      <div class="head">
        <div class="logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        </div>
        <h1 id="hdrTitle">Cargando…</h1>
        <p class="sub" id="hdrSub">Un momento</p>
      </div>
      <div class="body">
        <div class="spinner" aria-label="Cargando"></div>
      </div>
    </div>
  </div>

<script src="/location.js"></script>
<script>
(function(){
  // El token viene en la URL: /confirmar/<token>
  const m = location.pathname.match(/\/confirmar\/([a-f0-9]{32})/i);
  const token = m ? m[1] : null;

  // Lo que llega por /confirmar/ SIN ser un token. Son dos cosas que la propia
  // app le enseña al doctor: el link de muestra del editor de plantilla
  // (…/confirmar/abc123ejemplo) y el hueco de guiones bajos que el cajón pinta
  // mientras la confirmación no se ha enviado. Antes ninguno llegaba hasta aquí
  // —el servidor solo enrutaba tokens bien formados y el resto acababa en la
  // landing—, así que el doctor probaba su propio mensaje y aterrizaba en la
  // página de ventas. Ahora se le dice qué está mirando.
  const enlaceCrudo = (() => {
    const trozo = location.pathname.split(/\/confirmar\/?/i)[1] || '';
    try { return decodeURIComponent(trozo); } catch (_) { return trozo; }
  })();
  const esEnlaceDeMuestra = !token && (/^_+$/.test(enlaceCrudo) || /ejemplo/i.test(enlaceCrudo));
  // Modo preview: render con datos de ejemplo, sin tocar la API.
  // Usado desde /confirmaciones.html para que el staff vea cómo se ve.
  const isPreview = new URLSearchParams(location.search).get('preview') === '1';

  const stateEl = document.getElementById('state');

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function fmtDateTime(iso){
    try{
      const d = new Date(iso);
      const weekdays = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
      const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      const wd = weekdays[d.getDay()];
      const day = d.getDate();
      const mon = months[d.getMonth()];
      const yr = d.getFullYear();
      const h = d.getHours();
      const mm = String(d.getMinutes()).padStart(2,'0');
      const ampm = h >= 12 ? 'p.m.' : 'a.m.';
      const h12 = ((h + 11) % 12) + 1;
      return {
        full: `${wd}, ${day} de ${mon} de ${yr}`,
        time: `${h12}:${mm} ${ampm}`
      };
    } catch(e) {
      return { full: '—', time: '—' };
    }
  }

  // El saludo de la tarjeta lo escribe la clínica en Confirmaciones › Configurar
  // plantilla, con las mismas {{variables}} que el mensaje de WhatsApp.
  // Orden importante: primero se escapa la plantilla ENTERA y después se sustituyen
  // las variables por valores ya escapados. Al revés, un nombre con "<" acabaría
  // inyectando HTML en una página pública.
  var CARD_MESSAGE_DEFAULT = 'Hola {{paciente}}, ¿podrás asistir a esta cita?';

  // Los nombres de los datos van en español ({{paciente}}, {{fecha}}…) y los
  // viejos en inglés siguen valiendo. Esta página es pública y no carga
  // whatsapp.js —que es quien tiene la tabla de nombres—, así que resuelve con
  // la misma regla: minúsculas, sin tildes y sin espacios ni guiones bajos.
  // Si se toca aquí, tocar también ALIAS en public/whatsapp.js.
  var ALIAS = {
    paciente: 'patientName', nombrepaciente: 'patientName', nombredelpaciente: 'patientName',
    clinica: 'clinicName', nombreclinica: 'clinicName',
    doctor: 'doctorName', doctora: 'doctorName', medico: 'doctorName',
    fecha: 'appointmentDate', dia: 'appointmentDate',
    hora: 'appointmentTime'
  };

  function claveDeDato(nombre){
    var norm = String(nombre == null ? '' : nombre).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[\s_-]/g, '');
    return ALIAS[norm] || String(nombre || '').trim();
  }

  function cardMessage(data){
    var f = fmtDateTime(data.scheduled_at);
    var valores = {
      patientName: data.patient_name || '',
      clinicName: data.clinic_name || '',
      doctorName: data.doctor_name || '',
      appointmentDate: f.full,
      appointmentTime: f.time
    };
    var plantilla = esc(data.card_message || CARD_MESSAGE_DEFAULT);
    // `[^{}]+` y no `\w+`: los nombres en español llevan tildes.
    return plantilla.replace(/\{\{\s*([^{}]+?)\s*\}\}/g, function(m, nombre){
      var clave = claveDeDato(nombre);
      if (!(clave in valores)) return '';           // variable desconocida → fuera
      return '<b>' + esc(valores[clave]) + '</b>';
    });
  }

  // Bloque de ubicación: el paciente que acaba de confirmar necesita llegar, así
  // que aquí van el mapa, la dirección, las referencias y los tres accesos —
  // Google Maps, Waze y reenviarse la ubicación por WhatsApp. El HTML y los
  // estilos viven en location.js para que las tres pantallas se vean igual.
  function locationBlock(data){
    var f = fmtDateTime(data.scheduled_at);
    return SDLocation.blockHtml({
      loc: SDLocation.from(data),
      when: f.full + ' · ' + f.time,
      intro: 'Mi cita en ' + (data.clinic_name || 'la clínica')
    });
  }

  // Cabecera de marca. La comparten los cuatro estados (pregunta, confirmada,
  // cancelada y error) para que la tarjeta nunca se quede sin clínica ni color.
  function headHtml(clinicName, brandColor, sub){
    var estilo = brandColor ? ' style="--brand:' + esc(brandColor) + '"' : '';
    return '<div class="head"' + estilo + '>' +
      '<div class="logo" aria-hidden="true">' + LOGO_SVG + '</div>' +
      '<h1>Confirmación de cita</h1>' +
      '<p class="sub">' + esc(sub || clinicName || 'SaludDigital') + '</p>' +
    '</div>';
  }

  var LOGO_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>';

  function renderError(title, msg){
    stateEl.innerHTML = `
      ${headHtml(null, null, 'SaludDigital')}
      <div class="body">
        <div class="state-icon bad" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/></svg>
        </div>
        <div class="center">
          <h2>${esc(title)}</h2>
          <p>${esc(msg)}</p>
        </div>
      </div>`;
  }

  function renderResult(action, data){
    const f = fmtDateTime(data.scheduled_at);
    if (action === 'confirm') {
      stateEl.innerHTML = `
        ${headHtml(data.clinic_name, data.brand_color)}
        <div class="body">
          <div class="state-icon ok" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>
          </div>
          <div class="center">
            <h2>¡Cita confirmada!</h2>
            <p>${esc(data.clinic_name)} te espera el <b>${esc(f.full)}</b> a las <b>${esc(f.time)}</b></p>
            <button type="button" class="change-link" id="changeBtn">Necesito cambiarla</button>
          </div>
          ${locationBlock(data)}
        </div>
        <div class="clinic-foot">
          ¿Tienes una duda? Contacta a <b>${esc(data.clinic_name)}</b>${data.clinic_phone ? ` al <a href="tel:${esc(data.clinic_phone)}">${esc(data.clinic_phone)}</a>` : ''}.
        </div>`;
      const change = document.getElementById('changeBtn');
      if (change) change.addEventListener('click', () => render(data, true));
    } else {
      stateEl.innerHTML = `
        ${headHtml(data.clinic_name, data.brand_color)}
        <div class="body">
          <div class="state-icon warn" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          </div>
          <div class="center">
            <h2>Gracias por avisar</h2>
            <p>Marcamos tu cita como cancelada. Si quieres reagendar, contacta a <b>${esc(data.clinic_name)}</b>${data.clinic_phone ? ` al <a href="tel:${esc(data.clinic_phone)}">${esc(data.clinic_phone)}</a>` : ''}.</p>
            <button type="button" class="change-link" id="changeBtn">Volví a cambiar de opinión</button>
          </div>
        </div>
        <div class="clinic-foot">
          ${esc(data.clinic_name)}
        </div>`;
      const change = document.getElementById('changeBtn');
      if (change) change.addEventListener('click', () => render(data, true));
    }
  }

  function render(data, force){
    // Si ya respondió, mostramos el estado salvo que pida cambiarlo (force).
    if (!force && (data.status === 'confirmed' || data.status === 'declined')) {
      return renderResult(data.status === 'confirmed' ? 'confirm' : 'decline', data);
    }

    const f = fmtDateTime(data.scheduled_at);
    const past = new Date(data.scheduled_at) < new Date();

    stateEl.innerHTML = `
      ${headHtml(data.clinic_name || 'Clínica', data.brand_color)}
      <div class="body">
        <p style="margin:0 0 16px; color:var(--ink-2); font-size:14.5px; line-height:1.55; text-align:center; white-space:pre-line">${cardMessage(data)}</p>
        <div class="info-block">
          <div class="info-row">
            <span class="k">Fecha</span>
            <span class="v">${esc(f.full)}</span>
          </div>
          <div class="info-row">
            <span class="k">Hora</span>
            <span class="v">${esc(f.time)}</span>
          </div>
          <div class="info-row">
            <span class="k">Doctor</span>
            <span class="v">${esc(data.doctor_name || '—')}</span>
          </div>
        </div>
        ${locationBlock(data)}
        ${past ? `
          <div class="center" style="padding:8px 0 4px">
            <p style="color:var(--ink-3)">Esta cita ya pasó y no se puede actualizar desde aquí.</p>
          </div>
        ` : `
          <div class="actions">
            <button class="btn btn-primary" data-act="confirm">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>
              Sí, asistiré
            </button>
            <button class="btn btn-secondary" data-act="decline">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              No podré asistir
            </button>
          </div>
        `}
      </div>
      <div class="clinic-foot">
        ${esc(data.clinic_name || 'Clínica')}${data.clinic_phone ? ` · <a href="tel:${esc(data.clinic_phone)}">${esc(data.clinic_phone)}</a>` : ''}
      </div>`;

    if (past) return;

    stateEl.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const action = btn.getAttribute('data-act');
        // Deshabilitamos ambos para evitar doble-clic; respond() reactiva si hay error.
        stateEl.querySelectorAll('button[data-act]').forEach(b => b.disabled = true);
        try {
          const res = await fetch(`/api/confirmations/public/${token}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action })
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Error');
          data.status = json.status;
          data.responded_at = new Date().toISOString();
          renderResult(action, data);
        } catch (e) {
          stateEl.querySelectorAll('button[data-act]').forEach(b => b.disabled = false);
          alert('No se pudo guardar tu respuesta: ' + (e.message || 'error desconocido'));
        }
      });
    });
  }

  // Respaldo: la vista previa se abre desde la app, con sesión. Si se abre sin
  // ella —o la petición falla— sigue habiendo algo que enseñar, pero con nombres
  // que se leen como lo que son: un ejemplo.
  function datosDeEjemplo(){
    // Mañana a las 10:00 — futuro, evita el caso "cita pasada".
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(10, 0, 0, 0);
    return {
      patient_name: 'María González',
      doctor_name: 'Dr. Álvaro Lobo',
      clinic_name: 'Clínica Demostración',
      clinic_phone: '+504 2222-3333',
      brand_color: '#0891b2',
      clinic_address: 'Col. Palmira, Av. República de Chile',
      clinic_city: 'Tegucigalpa',
      latitude: 14.0985,
      longitude: -87.1937,
      location_notes: 'Edificio azul frente al parque, segundo piso.',
      scheduled_at: tomorrow.toISOString(),
      status: 'sent',
      ejemplo: true,
    };
  }

  // Lo de verdad: la clínica, el doctor y la próxima cita de quien está mirando.
  // Sin esto la vista previa enseñaba una clínica inventada, que es justo lo que
  // el doctor NO necesita ver.
  async function datosDePrevia(){
    try {
      const cab = {};
      // La cookie de sesión viaja sola (mismo origen). El Bearer se manda además
      // por las sesiones viejas que aún viven en localStorage.
      try {
        const t = localStorage.getItem('sd_token');
        if (t) cab['Authorization'] = 'Bearer ' + t;
      } catch (_) {}
      const res = await fetch('/api/confirmations/preview', { headers: cab, credentials: 'same-origin' });
      if (!res.ok) return datosDeEjemplo();
      const real = await res.json();
      return real && real.clinic_name ? real : datosDeEjemplo();
    } catch (_) {
      return datosDeEjemplo();
    }
  }

  // Volver de la vista previa: si esta pestaña la abrió la app, cerrarla deja al
  // doctor donde estaba; si la previa se abrió en la misma pestaña, atrás; y si
  // no hay ni una cosa ni la otra, se va derecho a Confirmaciones.
  function salirDeLaPrevia(){
    if (window.opener && !window.opener.closed) { window.close(); return; }
    try {
      const ref = document.referrer ? new URL(document.referrer) : null;
      if (ref && ref.origin === location.origin && history.length > 1) { history.back(); return; }
    } catch (_) {}
    location.href = '/confirmaciones.html';
  }

  async function renderPreview(){
    const data = await datosDePrevia();
    // El editor de plantilla manda ?msg= para enseñar el texto que se está
    // escribiendo, sin guardarlo antes. Si no viene, el guardado de la clínica.
    const escribiendo = new URLSearchParams(location.search).get('msg');
    if (escribiendo) data.card_message = escribiendo;
    if (!data.card_message) data.card_message = CARD_MESSAGE_DEFAULT;

    // Banner sutil indicando que es preview, con salida a la vista. La previa se
    // abre en una pestaña aparte y volver dependía del gesto del navegador
    // (deslizar hacia atrás), que no todo el mundo conoce: aquí hay un botón.
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) 8px calc(12px + env(safe-area-inset-left, 0px)); background:linear-gradient(180deg, rgba(255,251,235,.86), rgba(254,243,199,.72)); -webkit-backdrop-filter:saturate(160%) blur(14px); backdrop-filter:saturate(160%) blur(14px); color:#854d0e; font-size:12.5px; font-weight:600; border-bottom:1px solid rgba(253,230,138,.9); box-shadow:0 8px 24px -18px rgba(120,53,15,.6); z-index:10; letter-spacing:.02em';

    const btnVolver = document.createElement('button');
    btnVolver.type = 'button';
    btnVolver.setAttribute('aria-label', 'Volver a Confirmaciones');
    btnVolver.style.cssText = 'flex-shrink:0; display:inline-flex; align-items:center; gap:5px; padding:6px 12px 6px 9px; background:linear-gradient(160deg, rgba(255,255,255,.95), rgba(255,255,255,.7)); color:#854d0e; border:1px solid rgba(252,211,77,.9); border-radius:999px; box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 6px 14px -10px rgba(120,53,15,.6); font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; line-height:1';
    btnVolver.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Volver';
    btnVolver.addEventListener('click', salirDeLaPrevia);

    const aviso = document.createElement('span');
    aviso.style.cssText = 'flex:1; min-width:0; text-align:center; line-height:1.35';
    aviso.textContent = data.ejemplo
      ? 'Vista previa con datos de ejemplo · Abrila desde la app para ver la tuya'
      : (data.cita_real
          ? 'Vista previa · Es tu próxima cita. Los botones no envían ni cambian nada'
          : 'Vista previa · Los botones no envían nada real');

    banner.append(btnVolver, aviso);
    document.body.prepend(banner);
    // El aviso envuelve en pantallas estrechas, así que el hueco se mide, no
    // se supone.
    const ajustarHueco = () => {
      document.body.style.paddingTop = (banner.offsetHeight || 32) + 'px';
    };
    ajustarHueco();
    window.addEventListener('resize', ajustarHueco);
    render(data, false);
    // Intercepta clics en los botones y solo muestra el resultado simulado.
    setTimeout(() => {
      stateEl.querySelectorAll('button[data-act]').forEach(btn => {
        const newBtn = btn.cloneNode(true);
        btn.replaceWith(newBtn);
        newBtn.addEventListener('click', () => {
          const act = newBtn.getAttribute('data-act');
          data.status = act === 'confirm' ? 'confirmed' : 'declined';
          data.responded_at = new Date().toISOString();
          renderResult(act, data);
        });
      });
    }, 0);
  }

  async function init(){
    if (isPreview) { await renderPreview(); return; }
    if (esEnlaceDeMuestra) {
      renderError(
        'Enlace de muestra',
        'Este es el link de ejemplo que enseña el editor del mensaje, no una cita. El que reciba tu paciente abre su propia tarjeta de confirmación.'
      );
      return;
    }
    if (!token) {
      renderError('Link inválido', 'El enlace que recibiste no es válido. Es posible que se haya cortado al copiarlo. Pídele a tu clínica que te lo reenvíe.');
      return;
    }
    try {
      const res = await fetch(`/api/confirmations/public/${token}`);
      if (res.status === 404) {
        renderError('Confirmación no encontrada', 'Es posible que el link haya expirado o se haya eliminado. Contacta a tu clínica si necesitas reconfirmar.');
        return;
      }
      const data = await res.json();
      if (!res.ok) {
        renderError('No se pudo cargar', data.error || 'Inténtalo de nuevo en un momento.');
        return;
      }
      render(data, false);
    } catch (e) {
      renderError('Sin conexión', 'No pudimos contactar al servidor. Verifica tu conexión a internet y recarga la página.');
    }
  }

  init();
})();
</script>
</body>
</html>
