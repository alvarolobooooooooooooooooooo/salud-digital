<!doctype html>
<html lang="es">
<head>
<script src="/theme.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Consulta · Odontopediatría</title>
<link rel="stylesheet" href="/layout.css"/>
<style>
  /* =========================================================
     Salud Digital — design tokens (from colors_and_type.css)
     Scoped to the odontopediatría clinical-history surface.
     ========================================================= */
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap');

  .hc-root {
    --sd-navy-900:#001638; --sd-navy-800:#002050; --sd-navy-700:#002A60; --sd-navy-600:#103A78; --sd-navy-500:#25579E;
    --sd-blue-700:#00638A; --sd-blue-600:#0080B0; --sd-blue-500:#1796C6; --sd-blue-400:#54B0DD; --sd-blue-300:#9BD0EA;
    --sd-blue-200:#D2E9F5; --sd-blue-100:#EAF4FA; --sd-blue-50:#F4FAFD;
    --sd-ink-1000:#0B1424; --sd-ink-900:#1A2235; --sd-ink-700:#3F485C; --sd-ink-500:#606A7C; --sd-ink-400:#8A93A4;
    --sd-ink-300:#BDC4D0; --sd-ink-200:#DCE1E9; --sd-ink-150:#E8ECF2; --sd-ink-100:#F1F4F8; --sd-ink-50:#F7F9FC; --sd-ink-0:#FFFFFF;
    --sd-vital-600:#198754; --sd-vital-500:#2BA86A; --sd-vital-100:#E3F4EC;
    --sd-alert-600:#C7811C; --sd-alert-500:#E0992E; --sd-alert-100:#FBEFDB;
    --sd-critical-600:#C2362C; --sd-critical-500:#DA453A; --sd-critical-100:#FBE5E3;
    --bg-app:var(--sd-ink-50); --fg-default:var(--sd-ink-900); --fg-strong:var(--sd-ink-1000); --fg-muted:var(--sd-ink-500);
    --fg-subtle:var(--sd-ink-400); --fg-link:var(--sd-blue-700); --fg-brand:var(--sd-navy-700);
    --border-soft:var(--sd-ink-150); --border-default:var(--sd-ink-200); --border-strong:var(--sd-ink-300);
    --font-display:'Manrope','Nunito Sans',system-ui,sans-serif;
    --font-body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono','SF Mono',Menlo,monospace;
    --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-pill:999px;
    --shadow-xs:0 1px 2px rgba(11,20,36,0.05); --shadow-lg:0 12px 28px rgba(11,20,36,0.10),0 4px 10px rgba(11,20,36,0.05);
    --ease-out:cubic-bezier(.22,.61,.36,1); --dur-1:120ms;
  }

  .hc-root * { box-sizing: border-box; }
  .hc-root ::selection { background: var(--sd-blue-200); }

  .hc-root { --hc-accent: var(--sd-blue-600); max-width: 1180px; margin: 0 auto; padding: 8px 4px 80px;
    font-family: var(--font-body); color: var(--fg-default); }

  /* ============ PATIENT BAR ============ */
  .hc-patientbar { display: flex; justify-content: space-between; align-items: center; gap: 24px;
    background: #fff; border: 1px solid var(--border-default); border-radius: var(--r-lg);
    padding: 20px 24px; margin-bottom: 16px; }
  .hc-pb-left { display: flex; align-items: center; gap: 18px; }
  .hc-avatar { width: 56px; height: 56px; border-radius: var(--r-pill); flex: 0 0 56px;
    background: var(--sd-blue-100); color: var(--sd-blue-700); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
  .hc-pb-eyebrow { font-family: var(--font-display); font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--fg-brand); }
  .hc-pb-name { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--fg-strong); margin: 3px 0 6px; }
  .hc-pb-meta { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--fg-muted); flex-wrap: wrap; }
  .hc-pb-meta i { width: 3px; height: 3px; border-radius: 999px; background: var(--sd-ink-300); display: inline-block; }
  .hc-pb-meta .mono { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg-default); }
  .hc-pb-right { display: flex; align-items: center; gap: 14px; }
  .hc-alert-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--sd-critical-100);
    color: var(--sd-critical-600); font-size: 12.5px; font-weight: 600; padding: 8px 12px; border-radius: var(--r-md);
    border: 1px solid #F3CFCB; max-width: 240px; }
  .hc-pb-index { text-align: center; background: var(--sd-ink-50); border: 1px solid var(--border-soft);
    border-radius: var(--r-md); padding: 8px 16px; min-width: 66px; }
  .hc-pb-index-v { display: block; font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--fg-strong); line-height: 1; }
  .hc-pb-index-l { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); margin-top: 4px; }

  /* ============ SECTION NAV ============ */
  .hc-nav { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 6px;
    padding: 12px; margin: 0 0 20px; background: rgba(247,249,252,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-soft); border-radius: var(--r-md); }
  .hc-nav-chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
    border: 1px solid var(--border-default); background: #fff; border-radius: var(--r-pill);
    font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--fg-muted); cursor: pointer;
    transition: all var(--dur-1) var(--ease-out); white-space: nowrap; }
  .hc-nav-chip:hover { border-color: var(--border-strong); color: var(--fg-default); }
  .hc-nav-chip.on { background: var(--hc-accent); border-color: var(--hc-accent); color: #fff; }
  .hc-nav-num { font-family: var(--font-mono); font-size: 11px; opacity: 0.6; }
  .hc-nav-chip.on .hc-nav-num { opacity: 0.8; }

  /* ============ CARDS ============ */
  .hc-main { display: flex; flex-direction: column; gap: 20px; }
  .hc-card { background: #fff; border: 1px solid var(--border-default); border-radius: var(--r-lg);
    padding: 28px 32px; scroll-margin-top: 76px; }
  .hc-card-head { display: flex; gap: 16px; align-items: flex-start; padding-bottom: 20px; margin-bottom: 22px;
    border-bottom: 1px solid var(--border-soft); }
  .hc-card-num { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--hc-accent);
    background: var(--sd-blue-100); border-radius: var(--r-sm); padding: 4px 9px; margin-top: 2px; }
  .hc-card-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em;
    color: var(--fg-strong); margin: 0; }
  .hc-card-sub { font-size: 13.5px; color: var(--fg-muted); margin: 4px 0 0; }

  /* ============ SUBGROUPS + GRID + FIELDS ============ */
  .hc-subgroup { margin-bottom: 24px; }
  .hc-subgroup:last-child { margin-bottom: 0; }
  .hc-subgroup-title { font-family: var(--font-display); font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--fg-muted); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px dashed var(--border-default); }
  .hc-grid { display: grid; gap: 16px 18px; margin-bottom: 16px; }
  .hc-grid:last-child { margin-bottom: 0; }
  .hc-grid.c2 { grid-template-columns: repeat(2, 1fr); }
  .hc-grid.c3 { grid-template-columns: repeat(3, 1fr); }
  .hc-span-2 { grid-column: span 2; }
  .hc-span-3 { grid-column: span 3; }
  .hc-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .hc-grid .hc-field { margin-bottom: 0; }
  .hc-field:last-child { margin-bottom: 0; }
  .hc-label { font-size: 13px; font-weight: 600; color: var(--fg-default); letter-spacing: 0.01em; }
  .hc-req { color: var(--sd-critical-500); margin-left: 3px; }
  .hc-help { font-size: 12px; color: var(--fg-muted); line-height: 1.4; }
  .hc-help.err { color: var(--sd-critical-600); }

  .hc-input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border-default);
    border-radius: var(--r-md); font-family: var(--font-body); font-size: 14px; color: var(--fg-strong);
    background: #fff; outline: none; transition: border-color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out); }
  .hc-input::placeholder { color: var(--sd-ink-400); }
  .hc-input:hover { border-color: var(--border-strong); }
  .hc-input:focus { border-color: var(--hc-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--hc-accent) 22%, transparent); }
  .hc-input.error { border-color: var(--sd-critical-500); box-shadow: 0 0 0 4px rgba(218,69,58,0.14); }
  .hc-input.mono { font-family: var(--font-mono); letter-spacing: 0.02em; }
  .hc-textarea { height: auto; padding: 10px 12px; line-height: 1.5; resize: vertical; }

  .hc-select-wrap { position: relative; }
  .hc-select { width: 100%; appearance: none; padding-right: 36px; cursor: pointer; }
  .hc-select-caret { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-subtle); pointer-events: none; }

  .hc-suffix-wrap { position: relative; max-width: 140px; }
  .hc-suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); font-size: 14px; }

  /* ============ SWITCH / TOGGLE ROWS ============ */
  .hc-switch { width: 38px; height: 22px; background: var(--sd-ink-200); border: none; border-radius: 999px;
    position: relative; cursor: pointer; transition: background var(--dur-1) var(--ease-out); flex: 0 0 38px; }
  .hc-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff;
    border-radius: 999px; box-shadow: var(--shadow-xs); transition: left var(--dur-1) var(--ease-out); }
  .hc-switch.on { background: var(--hc-accent); }
  .hc-switch.on::after { left: 18px; }

  .hc-toggle-list { border: 1px solid var(--border-default); border-radius: var(--r-md); overflow: hidden; }
  .hc-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 16px; border-bottom: 1px solid var(--border-soft); }
  .hc-toggle-list .hc-toggle-row:last-child { border-bottom: none; }
  .hc-toggle-text { display: flex; flex-direction: column; gap: 2px; }
  .hc-toggle-label { font-size: 14px; font-weight: 500; color: var(--fg-default); }
  .hc-toggle-sub { font-size: 12px; color: var(--fg-muted); }
  .hc-toggle-right { display: flex; align-items: center; gap: 12px; }
  .hc-inline-input { height: 32px; width: 190px; padding: 0 10px; border: 1px solid var(--border-default);
    border-radius: var(--r-sm); font-family: var(--font-body); font-size: 13px; color: var(--fg-strong); outline: none; }
  .hc-inline-input:focus { border-color: var(--hc-accent); }

  /* ============ CHECK / RADIO ============ */
  .hc-checkgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 18px; }
  .hc-check-item, .hc-radio-item { display: flex; align-items: center; gap: 10px; background: none; border: none;
    padding: 6px 0; cursor: pointer; text-align: left; font-family: var(--font-body); }
  .hc-check { width: 19px; height: 19px; flex: 0 0 19px; border: 1.5px solid var(--border-strong); border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center; color: #fff; transition: all var(--dur-1) var(--ease-out); }
  .hc-check.on { background: var(--hc-accent); border-color: var(--hc-accent); }
  .hc-check-label { font-size: 14px; color: var(--fg-default); }

  /* ============ SEGMENTED ============ */
  .hc-seg { display: inline-flex; padding: 3px; background: var(--sd-ink-100); border-radius: var(--r-md); gap: 2px; flex-wrap: wrap; }
  .hc-seg button { background: transparent; border: 0; padding: 7px 14px; font-size: 13px; font-weight: 600;
    font-family: var(--font-body); color: var(--fg-muted); border-radius: 7px; cursor: pointer; transition: all var(--dur-1) var(--ease-out); }
  .hc-seg button:hover { color: var(--fg-default); }
  .hc-seg button.on { background: #fff; color: var(--fg-strong); box-shadow: var(--shadow-xs); }

  .hc-chip-toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .hc-toggle-chip { padding: 8px 14px; border: 1px solid var(--border-default); background: #fff; border-radius: var(--r-pill);
    font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--fg-muted); cursor: pointer; transition: all var(--dur-1) var(--ease-out); }
  .hc-toggle-chip:hover { border-color: var(--border-strong); }
  .hc-toggle-chip.on { background: var(--sd-blue-100); border-color: var(--sd-blue-300); color: var(--sd-blue-700); }

  /* ============ TABLE (plan) ============ */
  .hc-table { border: 1px solid var(--border-default); border-radius: var(--r-md); overflow: hidden; }
  .hc-tr { display: grid; grid-template-columns: 150px 110px 1fr 150px 44px; align-items: center; border-bottom: 1px solid var(--border-soft); }
  .hc-tr:last-child { border-bottom: none; }
  .hc-th { background: var(--sd-ink-50); }
  .hc-th .hc-td { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted); padding: 10px 12px; }
  .hc-td { padding: 6px 8px; }
  .hc-td.c-fase { padding-left: 12px; }
  .hc-cell-input { width: 100%; height: 34px; padding: 0 8px; border: 1px solid transparent; background: transparent;
    border-radius: var(--r-sm); font-family: var(--font-body); font-size: 13.5px; color: var(--fg-strong); outline: none; cursor: pointer; }
  .hc-cell-input.mono { font-family: var(--font-mono); font-size: 12.5px; }
  .hc-cell-input:hover { border-color: var(--border-default); background: #fff; }
  .hc-cell-input:focus { border-color: var(--hc-accent); background: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--hc-accent) 16%, transparent); }
  select.hc-cell-input { appearance: none; }
  .hc-cell-input.pill-ok { color: var(--sd-vital-600); font-weight: 600; }
  .hc-cell-input.pill-warn { color: var(--sd-alert-600); font-weight: 600; }
  .hc-cell-input.pill-muted { color: var(--fg-muted); }
  .hc-row-del { width: 32px; height: 32px; border: none; background: none; border-radius: var(--r-sm); color: var(--fg-subtle);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all var(--dur-1) var(--ease-out); }
  .hc-row-del:hover { background: var(--sd-critical-100); color: var(--sd-critical-600); }
  .hc-empty { padding: 20px; text-align: center; font-size: 13.5px; color: var(--fg-muted); }
  .hc-btn-add { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; height: 38px; padding: 0 16px;
    border: 1px dashed var(--border-strong); background: #fff; border-radius: var(--r-md); font-family: var(--font-body);
    font-size: 13.5px; font-weight: 600; color: var(--fg-default); cursor: pointer; transition: all var(--dur-1) var(--ease-out); }
  .hc-btn-add:hover { border-color: var(--hc-accent); color: var(--hc-accent); border-style: solid; }

  /* ============ INDEX CARDS ============ */
  .hc-index-row { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 16px; margin-bottom: 24px; }
  .hc-index-card { border: 1px solid var(--border-default); border-radius: var(--r-md); padding: 18px 20px; background: var(--sd-blue-50); }
  .hc-index-total { font-family: var(--font-display); font-size: 40px; font-weight: 800; color: var(--fg-strong); line-height: 1; letter-spacing: -0.02em; }
  .hc-index-name { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--sd-blue-700); margin-top: 6px; }
  .hc-index-sub { font-size: 12px; color: var(--fg-muted); margin-bottom: 14px; }
  .hc-index-break { display: flex; gap: 16px; }
  .hc-index-cell { display: flex; flex-direction: column; gap: 3px; }
  .hc-index-dot { width: 9px; height: 9px; border-radius: 999px; }
  .hc-index-dot.crit { background: var(--sd-critical-500); }
  .hc-index-dot.muted { background: var(--sd-ink-400); }
  .hc-index-dot.blue { background: var(--sd-blue-600); }
  .hc-index-k { font-size: 11px; color: var(--fg-muted); }
  .hc-index-v { font-family: var(--font-mono); font-size: 16px; font-weight: 600; color: var(--fg-strong); }
  .hc-index-note { display: flex; gap: 10px; align-items: center; background: var(--sd-blue-100); border-radius: var(--r-md);
    padding: 16px 18px; font-size: 13px; color: var(--sd-blue-700); line-height: 1.45; }
  .hc-index-note svg { flex: 0 0 18px; }

  /* ============ TIMELINE ============ */
  .hc-note-compose { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 24px; }
  .hc-note-compose .hc-textarea { flex: 1; }
  .hc-timeline { display: flex; flex-direction: column; }
  .hc-tl-item { display: flex; gap: 14px; padding-bottom: 18px; position: relative; }
  .hc-tl-item:not(:last-child)::before { content: ""; position: absolute; left: 5px; top: 14px; bottom: 0; width: 1.5px; background: var(--border-default); }
  .hc-tl-dot { width: 11px; height: 11px; flex: 0 0 11px; border-radius: 999px; background: #fff; border: 2.5px solid var(--hc-accent); margin-top: 4px; z-index: 1; }
  .hc-tl-head { display: flex; gap: 12px; align-items: baseline; margin-bottom: 4px; }
  .hc-tl-date { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--fg-strong); }
  .hc-tl-prof { font-size: 12.5px; color: var(--fg-muted); }
  .hc-tl-text { font-size: 14px; color: var(--fg-default); margin: 0; line-height: 1.5; }

  /* ============ CONSENT ============ */
  .hc-consent-text { background: var(--sd-ink-50); border: 1px solid var(--border-soft); border-radius: var(--r-md);
    padding: 18px 22px; margin-bottom: 18px; }
  .hc-consent-text p { font-size: 13.5px; line-height: 1.6; color: var(--fg-default); margin: 0 0 10px; }
  .hc-consent-text p:last-child { margin-bottom: 0; }
  .hc-consent-check { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 22px; font-size: 14px; font-weight: 500; }
  .hc-firma { border: 1px solid var(--border-default); border-radius: var(--r-md); overflow: hidden; }
  .hc-firma-canvas { display: block; width: 100%; height: 130px; background:
    repeating-linear-gradient(0deg, #fff, #fff 28px, var(--sd-ink-100) 29px); cursor: crosshair; touch-action: none; }
  .hc-firma-base { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
    border-top: 1px solid var(--border-soft); background: var(--sd-ink-50); font-size: 12px; color: var(--fg-muted); }
  .hc-link-btn { background: none; border: none; color: var(--fg-link); font-family: var(--font-body); font-size: 12.5px;
    font-weight: 600; cursor: pointer; }
  .hc-link-btn:hover { text-decoration: underline; text-underline-offset: 2px; }

  /* ============ BUTTONS / FOOTER ============ */
  .hc-btn-primary, .hc-btn-secondary, .hc-btn-navy { display: inline-flex; align-items: center; gap: 8px; height: 40px;
    padding: 0 18px; font-family: var(--font-body); font-size: 14px; font-weight: 600; border-radius: var(--r-md);
    border: 1px solid transparent; cursor: pointer; transition: all var(--dur-1) var(--ease-out); white-space: nowrap; }
  .hc-btn-primary { background: var(--hc-accent); color: #fff; }
  .hc-btn-primary:hover { filter: brightness(0.93); }
  .hc-btn-secondary { background: #fff; color: var(--fg-strong); border-color: var(--border-default); }
  .hc-btn-secondary:hover { background: var(--sd-ink-100); border-color: var(--border-strong); }
  .hc-btn-navy { background: var(--sd-navy-700); color: #fff; }
  .hc-btn-navy:hover { background: var(--sd-navy-600); }
  .hc-btn-navy:disabled { opacity: 0.45; cursor: not-allowed; }
  .hc-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px;
    margin-top: 4px; position: sticky; bottom: 12px; background: rgba(255,255,255,0.94); backdrop-filter: blur(10px);
    border: 1px solid var(--border-default); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); }
  .hc-footer-note { font-size: 12.5px; color: var(--fg-muted); }
  .hc-footer-actions { display: flex; gap: 12px; }

  .hc-msg { padding: 12px 16px; border-radius: var(--r-md); font-size: 13.5px; font-weight: 600; margin-bottom: 16px;
    border-left: 4px solid; }
  .hc-msg.ok { color: #14532d; background: rgba(22,163,74,0.08); border-left-color: var(--sd-vital-600); }
  .hc-msg.err { color: #991b1b; background: rgba(218,69,58,0.08); border-left-color: var(--sd-critical-500); }

  /* ============ ODONTOGRAMA (general component) ============ */
  .odontogram-container {
    background: linear-gradient(135deg, #f8fafc 0%, rgba(236, 254, 255, 0.6) 100%);
    padding: 1.5rem 1rem; border-radius: var(--r-lg); border: 1px solid var(--border-default);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5); }
  .op-odonto-hint { display:flex; gap:10px; align-items:center; background: var(--sd-blue-100); color: var(--sd-blue-700);
    border-radius: var(--r-md); padding: 12px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.45; }

/* ─────────── ceo-d / CPO-D from the general odontogram state ─────────── */
// Deciduous (FDI quadrants 5-8) → ceo-d ; permanent (1-4) → CPO-D.
const FILLED_CONDS = ['restoration', 'amalgam', 'crown', 'endodontic', 'bridge'];
function calcPediatricIndices(state) {
  const acc = { ceo: { c: 0, e: 0, o: 0, total: 0 }, cpo: { c: 0, p: 0, o: 0, total: 0 } };
  Object.keys(state || {}).forEach((k) => {
    const fdi = +k; const st = state[fdi]; if (!st) return;
    const temp = Math.floor(fdi / 10) >= 5;
    const cond = st.condition || 'healthy';
    const surfVals = Object.values(st.surfaces || {});
    const hasCaries = cond === 'caries' || surfVals.includes('caries');
    const isMissing = cond === 'missing' || cond === 'extraction';
    const isFilled = FILLED_CONDS.includes(cond) || surfVals.some((v) => FILLED_CONDS.includes(v));
    let cat = null;
    if (hasCaries) cat = 'c';
    else if (isMissing) cat = 'e';
    else if (isFilled) cat = 'o';
    if (!cat) return;
    if (temp) { if (cat === 'c') acc.ceo.c++; else if (cat === 'e') acc.ceo.e++; else acc.ceo.o++; }
    else { if (cat === 'c') acc.cpo.c++; else if (cat === 'e') acc.cpo.p++; else acc.cpo.o++; }
  });
  acc.ceo.total = acc.ceo.c + acc.ceo.e + acc.ceo.o;
  acc.cpo.total = acc.cpo.c + acc.cpo.p + acc.cpo.o;
  return acc;
}

function FirmaPad({ value, onChange, readOnly }) {
  const ref = useRef(null); const drawing = useRef(false);
  const [empty, setEmpty] = useState(!value);
  useEffect(() => {
    const c = ref.current; const ctx = c.getContext("2d");
    const dpr = window.devicePixelRatio || 1; const r = c.getBoundingClientRect();
    c.width = r.width * dpr; c.height = r.height * dpr; ctx.scale(dpr, dpr);
    ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#002A60";
    if (value) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = value; }
  }, []);
  const pos = (e) => { const r = ref.current.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; };
  const start = (e) => { if (readOnly) return; drawing.current = true; const ctx = ref.current.getContext("2d"); const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const move = (e) => { if (!drawing.current) return; e.preventDefault(); const ctx = ref.current.getContext("2d"); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); setEmpty(false); };
  const end = () => { if (!drawing.current) return; drawing.current = false; onChange(ref.current.toDataURL()); };
  const clear = () => { if (readOnly) return; const c = ref.current; c.getContext("2d").clearRect(0, 0, c.width, c.height); setEmpty(true); onChange(null); };
  return (
    <div className="hc-firma">
      <canvas ref={ref} className="hc-firma-canvas" onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end} onTouchStart={start} onTouchMove={move} onTouchEnd={end}></canvas>
      <div className="hc-firma-base"><span>{empty ? "Firme con el dedo o el ratón" : "Firma capturada"}</span><button className="hc-link-btn" onClick={clear}>Limpiar</button></div>
    </div>
  );
}

function App({ ctx }) {
  const [form, setForm] = useState(() => ctx.initialForm);
  const [odonto, setOdonto] = useState(() => ctx.initialOdonto || {});
  const [active, setActive] = useState("paciente");
  const [msg, setMsg] = useState(null);
  const [saving, setSaving] = useState(false);
  const [savedDraft, setSavedDraft] = useState(false);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const idx = useMemo(() => calcPediatricIndices(odonto), [odonto]);
  const readOnly = ctx.readOnly;

  // Scroll-spy for the section nav chips
  useEffect(() => {
    const onScroll = () => {
      let cur = SECCIONES[0].id;
      for (const s of SECCIONES) {
        const el = document.getElementById("sec-" + s.id);
        if (el && el.getBoundingClientRect().top < 160) cur = s.id;
      }
      setActive(cur);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const goto = (id) => {
    const el = document.getElementById("sec-" + id);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: "smooth" });
  };

  const saveDraft = () => {
    if (!DRAFT_KEY) return;
    try {
      const odo = window.__opOdontoInst ? window.__opOdontoInst.getState() : odonto;
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ form, odonto: odo, ts: Date.now() }));
      setSavedDraft(true); setTimeout(() => setSavedDraft(false), 2200);
    } catch (e) { console.warn("draft save failed", e); }
  };

  const submit = async () => {
    if (saving || readOnly) return;
    setSaving(true);
    setMsg({ type: "ok", text: "Guardando…" });
    try {
      const me = await api('/api/auth/me');
      const odo = window.__opOdontoInst ? window.__opOdontoInst.getState() : odonto;
      const planText = (form.plan || []).map((r) => [r.fase, r.diente, r.proc, r.estado].filter(Boolean).join(" · ")).join("\n");
      const blob = JSON.stringify({ type: "odontopediatria", version: 1, odontogram: odo, form });
      const body = {
        patient_id: ctx.patientId,
        doctor_id: me.id,
        appointment_id: APPT_ID,
        specialty: "Odontopediatría",
        notes: form.m_motivo || null,
        diagnosis: form.dx_nota || null,
        treatment: planText || null,
        odontogram_state: blob,
        cost: 0,
        payment_status: "pending",
        payment_notes: "",
        consent_id: null,
        lifestyle: {},
        procedures: planText || null,
        radiography_notes: null,
        observations: form.e_notas || null,
        visit_reason: form.m_motivo || null,
      };
      const res = await api('/api/consultations', { method: 'POST', body });
      if (APPT_ID) {
        try { await api(`/api/appointments/${APPT_ID}/status`, { method: 'PUT', body: { status: 'completed' } }); } catch (_) {}
      }
      if (DRAFT_KEY) { try { localStorage.removeItem(DRAFT_KEY); } catch (_) {} }
      setMsg({ type: "ok", text: "Consulta guardada correctamente." });
      setTimeout(() => { window.location.href = '/citas.html'; }, 1500);
    } catch (err) {
      setMsg({ type: "err", text: err && err.message ? err.message : "Error al guardar la consulta." });
      setSaving(false);
    }
  };

  const COMPS = {

    diagnostico: <SecDiagnostico form={form} set={set} />,
    plan: <SecPlan form={form} set={set} />,
    indices: <SecIndices form={form} set={set} idx={idx} />,
    evolucion: <SecEvolucion form={form} set={set} profName={ctx.meName} />,
    consentimiento: <SecConsentimiento form={form} set={set} readOnly={readOnly} />,
  };

  return (
    <div className={"hc-root" + (readOnly ? " viewer" : "")}>
      <PatientBar form={form} idx={idx} ctx={ctx} />

      <nav className="hc-nav">
        {SECCIONES.map((s) => (

      {msg && <div className={"hc-msg " + msg.type}>{msg.text}</div>}

      <main className="hc-main">
        {SECCIONES.map((s) => (
          <section className="hc-card" id={"sec-" + s.id} key={s.id}>
            <header className="hc-card-head">
              <span className="hc-card-num">{s.num}</span>
              <div><h2 className="hc-card-title">{s.title}</h2><p className="hc-card-sub">{s.sub}</p></div>
            </header>
            <div className="hc-card-body">{COMPS[s.id]}</div>

        <footer className="hc-footer">
          <span className="hc-footer-note">
            {readOnly ? "Vista de consulta guardada · solo lectura"
              : (ctx.meName ? ("Profesional: " + ctx.meName) : "Historia clínica de odontopediatría")}

          <div className="hc-footer-actions">
            {readOnly ? (

            ) : (
              <>
                <button className="hc-btn-secondary" onClick={saveDraft}>{savedDraft ? "Borrador guardado" : "Guardar borrador"}</button>
                <button className="hc-btn-navy" onClick={submit} disabled={saving}>{saving ? "Guardando…" : "Guardar consulta"}</button>
              </>
            )}
          </div>
        </footer>
      </main>
    </div>
  );
}

function computeAge(dobStr) {
  if (!dobStr) return "";
  const dob = new Date(dobStr); if (isNaN(dob)) return "";
  const now = new Date();
  let years = now.getFullYear() - dob.getFullYear();
  let months = now.getMonth() - dob.getMonth();
  if (now.getDate() < dob.getDate()) months--;
  if (months < 0) { years--; months += 12; }
  if (years < 0) return "";
  return years + " año" + (years === 1 ? "" : "s") + (months ? " " + months + " mes" + (months === 1 ? "" : "es") : "");
}

(async function boot() {
  const loader = document.getElementById('pageLoader');
  const finish = (ctx) => {
    window.__opOdontoInitial = ctx.initialOdonto || {};
    ReactDOM.createRoot(document.getElementById('root')).render(<App ctx={ctx} />);
    if (loader) loader.classList.add('hidden');
  };
  const fail = (m) => { alert(m); history.back(); };

  try {
    requireAuth(['clinic_admin', 'doctor']);
    const me = await api('/api/auth/me');
    if (me.role === 'doctor' && me.specialty && me.specialty !== 'Odontopediatría') {
      window.location.href = '/citas.html'; return;
    }
    const meName = me.name ? ('Dr(a). ' + me.name) : '';

    if (IS_VIEW) {
      const c = await api(`/api/consultations/${VIEW_ID}`);
      if (!c) return fail('Consulta no encontrada');
      let raw = c.odontogram_state;
      if (typeof raw === 'string') { try { raw = JSON.parse(raw || '{}'); } catch (_) { raw = {}; } }
      raw = raw || {};
      const savedForm = raw.form || {};
      const savedOdo = raw.odontogram || (raw.type ? {} : raw) || {};
      const ctx = {
        readOnly: true, mode: 'view', patientId: c.patient_id, patientName: c.patient_name || 'Paciente',
        meName, expediente: c.patient_code || ('Consulta #' + VIEW_ID), allergies: null,
        initialForm: { ...emptyForm({ patientName: c.patient_name, meName }), ...savedForm },
        initialOdonto: savedOdo, patient: {},
      };
      return finish(ctx);
    }

    // Edit / new mode
    if (!APPT_ID) return fail('ID de cita no proporcionado');
    const appts = await api('/api/appointments');
    const appt = (appts || []).find((a) => a.id === APPT_ID);
    if (!appt) return fail('Cita no encontrada');
    const patientId = appt.patient_id;

    let patient = {};
    try { patient = await api(`/api/patients/${patientId}`) || {}; } catch (_) {}
    let allergies = null;
    try {
      const crit = await api(`/api/patients/${patientId}/critical-info`);
      if (crit && crit.allergies) allergies = crit.allergies;
    } catch (_) {}

    const ctx = {
      readOnly: false, mode: 'edit', patientId, patientName: appt.patient_name || patient.name || '',
      meName, expediente: patient.patient_code || patient.code || '', allergies, patient,
      patientAge: computeAge(patient.birth_date || patient.dob),
      initialForm: null, initialOdonto: {},
    };
    ctx.initialForm = emptyForm(ctx);

    // Restore a locally saved draft, if present.
    if (DRAFT_KEY) {
      try {
        const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
        if (d && d.form) { ctx.initialForm = { ...ctx.initialForm, ...d.form }; ctx.initialOdonto = d.odonto || {}; }
      } catch (_) {}
    }
    finish(ctx);
  } catch (e) {
    console.error(e);
    fail('Error al cargar la consulta');
  }
})();
</script>
</body>
</html>
