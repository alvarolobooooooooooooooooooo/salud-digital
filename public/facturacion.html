<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SaludDigital — Facturación</title>

  <!-- Shell de la plataforma: sidebar, .layout-main, page-loader y tema
       (layout.css importa theme-dark.css). Aporta la tipografía del sistema. -->
  <link rel="stylesheet" href="/layout.css">

  <!-- Sistema de diseño del módulo de facturación: tokens + tipografía
       (colors_and_type.css) y componentes (.module, .card, .tbl, .btn…).
       Se cargan DESPUÉS de layout.css para que el módulo conserve su look;
       el sidebar y el shell siguen siendo los de la plataforma. -->
  <link rel="stylesheet" href="/facturacion-design/colors_and_type.css">
  <link rel="stylesheet" href="/facturacion-design/components.css">

  <style>
    /* ─────────────────────────────────────────────────────────────
       Integración NATIVA (sin iframe): el módulo de facturación se monta
       directamente dentro del shell de la plataforma. El sidebar, la
       tipografía y el tema (data-theme en <html>, que el módulo ya lee)
       son los de la plataforma; el módulo aporta su propio contenido.
       Mismo enfoque que mensajes.html (React montado en la plataforma).
       ───────────────────────────────────────────────────────────── */

    /* El módulo (.module) ya trae su propio padding interno
       (28px 32px 80px), así que anulamos el del contenedor para no
       duplicarlo. El fondo lo hereda de .layout-main → idéntico al
       resto de la plataforma (claro y oscuro). */
    .layout-main.fact-main {
      padding: 0;
      /* La animación de entrada de .layout-main termina en
         transform: translateX(0); ese transform "no-none" deja un
         stacking-context permanente que ATRAPARÍA los overlays
         (position:fixed) del módulo por debajo del sidebar (z-index:100).
         Sin la animación, .layout-main deja de ser stacking-context y los
         modales pueden cubrir el sidebar (ver z-index abajo). */
      animation: none;
    }

    /* En móvil el sidebar se sustituye por #mobileNav (fixed, top:0, 64px).
       Reservamos ese alto para que el header del módulo (título + chip CAI
       + "Emitir factura") no quede oculto bajo la barra. */
    @media (max-width: 860px) {
      .layout-main.fact-main {
        padding-top: calc(64px + env(safe-area-inset-top, 0px));
      }
    }

    /* Los overlays del módulo nacen con z-index bajo (.scrim:50, .toast:80),
       pensados para el iframe aislado. Ya en la plataforma deben superar al
       sidebar y al #mobileNav (z-index:100) para cubrirlos, como hacen los
       modales del resto de la plataforma. */
    .scrim { z-index: 1000; }
    .toast { z-index: 1100; }
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="page-loader-content">
      <div class="page-loader-spinner"></div>
      <div class="page-loader-text">Cargando facturación...</div>
    </div>
  </div>

  <!-- Nav + sidebar (inyectados por /layout.js) -->

  <main class="layout-main fact-main">
    <div id="root"></div>
  </main>

  <!-- Utilidades + auth + shell global de la plataforma -->
  <script src="/common.js"></script>
  <script>
    // Facturación: acceso financiero, igual que Finanzas/Pacientes.
    requireAuth(['clinic_admin', 'doctor']);
  </script>
  <script src="/icons.js"></script>
  <script src="/layout.js"></script>

  <!-- React + Babel (build de producción vía unpkg; permitido por el CSP,
       mismo patrón que mensajes.html). -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <!-- Módulo de facturación (datos en JS plano + componentes JSX compilados
       por Babel). Mismo orden de carga que el preview standalone
       (facturacion-design/index.html). -->
  <script type="text/babel" src="/facturacion-design/data.jsx"></script>
  <script type="text/babel" src="/facturacion-design/ui.jsx"></script>
  <script type="text/babel" src="/facturacion-design/screen-dashboard.jsx"></script>
  <script type="text/babel" src="/facturacion-design/screen-listado.jsx"></script>
  <script type="text/babel" src="/facturacion-design/screen-emitir.jsx"></script>
  <script type="text/babel" src="/facturacion-design/screen-detalle.jsx"></script>
  <script type="text/babel" src="/facturacion-design/screen-cobro.jsx"></script>
  <script type="text/babel" src="/facturacion-design/app.jsx"></script>

  <!-- Oculta el page-loader cuando el módulo monta (evento fact:ready que
       dispara app.jsx), con fallbacks por si Babel tarda en compilar. -->
  <script>
    (function () {
      var loader = document.getElementById('pageLoader');
      var hidden = false;
      function hide() { if (hidden) return; hidden = true; if (loader) loader.classList.add('hidden'); }
      window.addEventListener('fact:ready', hide);
      window.addEventListener('load', function () { setTimeout(hide, 500); });
      setTimeout(hide, 6000);
    })();
  </script>
</body>
</html>
