<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SaludDigital — Suscripción</title>
  <link rel="stylesheet" href="/layout.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       Suscripción — UI de producto sobre el vidrio de la plataforma:
       misma receta que configuracion/finanzas (gradiente translúcido +
       blur(14px) + borde blanco + blobs de fondo), pero sin degradados
       decorativos en el contenido. Todo scoped a .subs-page.
       ============================================================ */

    /* Fondo con color DETRÁS de las tarjetas. Clave: el backdrop-filter solo se
       nota si hay algo que difuminar; con los blobs en las esquinas (como en el
       resto de páginas) el vidrio quedaba invisible sobre fondo casi blanco.
       Aquí las manchas cruzan por debajo del contenido a propósito.
       Son estáticas: nada animado sobre una capa borrosa (mata los fps en
       WKWebView). En oscuro las pisa theme-dark.css con su propia versión. */
    body {
      background: linear-gradient(135deg, #f4f9fc 0%, #eef5fa 45%, #e6f6fb 100%);
      min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; width: 1100px; height: 1100px;
      background:
        radial-gradient(circle at 30% 30%, rgba(6, 182, 212, 0.30) 0%, transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(56, 189, 248, 0.24) 0%, transparent 62%);
      top: -420px; right: -160px; border-radius: 50%; z-index: 0;
      filter: blur(70px); pointer-events: none;
    }
    body::after {
      content: ''; position: fixed; width: 950px; height: 950px;
      background:
        radial-gradient(circle at 60% 40%, rgba(14, 165, 233, 0.22) 0%, transparent 62%),
        radial-gradient(circle at 25% 75%, rgba(45, 212, 191, 0.20) 0%, transparent 60%);
      bottom: -380px; left: 120px; border-radius: 50%; z-index: 0;
      filter: blur(75px); pointer-events: none;
    }

    /* En oscuro, theme-dark.css pisa los blobs con unos casi invisibles
       (alpha .025) y !important. Sobre negro plano el cristal tampoco se vería,
       así que esta pantalla recupera su propia aurora, tenue pero presente.
       Va después de layout.css en la cascada, por eso gana con !important. */
    html[data-theme="dark"] body::before {
      background:
        radial-gradient(circle at 35% 35%, rgba(34, 211, 238, .17) 0%, transparent 62%),
        radial-gradient(circle at 72% 62%, rgba(56, 189, 248, .13) 0%, transparent 60%) !important;
      filter: blur(80px) !important;
      opacity: 1 !important;
    }
    html[data-theme="dark"] body::after {
      background:
        radial-gradient(circle at 58% 42%, rgba(45, 212, 191, .13) 0%, transparent 60%),
        radial-gradient(circle at 28% 72%, rgba(99, 102, 241, .13) 0%, transparent 62%) !important;
      filter: blur(85px) !important;
      opacity: 1 !important;
    }

    .subs-page {
      /* Vidrio: se define una vez y lo reutilizan tarjetas, avisos y modal. */
      /* Translúcidas de verdad (~70%): a .88 el color de detrás no llegaba a
         atravesar y la "tarjeta de vidrio" se veía igual que una blanca. */
      --glass: linear-gradient(140deg, rgba(255, 255, 255, .72) 0%, rgba(236, 248, 255, .58) 100%);
      --glass-2: linear-gradient(140deg, rgba(255, 255, 255, .60) 0%, rgba(236, 248, 255, .46) 100%);
      --glass-border: rgba(255, 255, 255, .85);
      --glass-shadow:
        0 12px 32px -12px rgba(8, 74, 100, .22),
        inset 0 1px 0 rgba(255, 255, 255, .95);
      --blur: saturate(180%) blur(22px);
      --accent:      #0891B2;
      --accent-ink:  #0E7490;
      --accent-soft: #ECFBFE;
      --ok:     #0E9B6B;
      --warn:   #C77C15;
      --danger: #DC2626;

      --surface: #FFFFFF;
      --surface-2: rgba(255, 255, 255, .55);
      /* Líneas translúcidas: sobre cristal, una línea sólida se ve pegada encima
         en vez de grabada en la superficie. */
      --line: rgba(15, 23, 42, .10);
      --line-soft: rgba(15, 23, 42, .07);
      --text: #0F172A;
      --text-2: #475569;
      --muted: #64748B;
      --faint: #94A3B8;
      --shadow: 0 1px 2px rgba(15, 23, 42, .05);

      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding: 4px 0 64px;
      /* A todo el ancho del área de contenido, como configuración o finanzas:
         con un max-width fijo y sin centrar, en pantallas grandes quedaba una
         franja muerta a la derecha. */
      width: 100%;
      /* Por encima de los blobs (z-index: 0), o el contenido queda debajo. */
      position: relative;
      z-index: 1;
    }
    .subs-page * { box-sizing: border-box; }
    .subs-page button { font: inherit; cursor: pointer; }

    [data-theme="dark"] .subs-page {
      --accent:      #22D3EE;
      --accent-ink:  #67E8F9;
      --accent-soft: rgba(34, 211, 238, .10);
      --ok:     #34D399;
      --warn:   #FBBF24;
      --danger: #F87171;

      --surface: #121214;
      --surface-2: rgba(255, 255, 255, .04);
      --line: rgba(255, 255, 255, .08);
      --line-soft: rgba(255, 255, 255, .05);
      --text: #F1F5F9;
      --text-2: #CBD5E1;
      --muted: #94A3B8;
      --faint: #64748B;
      --shadow: none;

      /* Mismo vidrio en negro: superficie translúcida + un filo de luz arriba,
         que es lo que hace legible el canto del cristal sobre fondo oscuro. */
      --glass: linear-gradient(140deg, rgba(38, 40, 46, .58) 0%, rgba(18, 19, 23, .48) 100%);
      --glass-2: linear-gradient(140deg, rgba(44, 46, 52, .48) 0%, rgba(22, 23, 27, .38) 100%);
      --glass-border: rgba(255, 255, 255, .12);
      --glass-shadow:
        0 14px 36px -14px rgba(0, 0, 0, .65),
        inset 0 1px 0 rgba(255, 255, 255, .10);
    }

    /* ── Cabecera ── */
    .subs-page .head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 20px; flex-wrap: wrap; margin-bottom: 22px;
    }
    .subs-page h1 {
      font-size: 26px; font-weight: 600; letter-spacing: -0.02em;
      margin: 0 0 4px; color: var(--text);
    }
    .subs-page .head p { margin: 0; font-size: 13.5px; color: var(--muted); }

    .subs-page .ghost-btn {
      border: 1px solid var(--glass-border); background: var(--glass-2);
      -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
      border-radius: 9px; padding: 8px 13px;
      font-size: 12.5px; font-weight: 500; color: var(--text-2);
      display: inline-flex; align-items: center; gap: 7px;
      transition: border-color .15s ease, color .15s ease;
    }
    .subs-page .ghost-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
    .subs-page .ghost-btn:disabled { opacity: .5; cursor: not-allowed; }
    .subs-page .ghost-btn svg { width: 13px; height: 13px; }

    /* ── Avisos ── */
    .subs-page .notice {
      display: flex; gap: 12px; align-items: flex-start;
      border: 1px solid var(--glass-border); border-left: 3px solid var(--faint);
      background: var(--glass); border-radius: 12px;
      -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
      box-shadow: var(--glass-shadow);
      padding: 13px 16px; margin-bottom: 18px;
      font-size: 13px; line-height: 1.55; color: var(--text-2);
    }
    .subs-page .notice b { display: block; color: var(--text); font-weight: 600; margin-bottom: 1px; }
    .subs-page .notice svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; color: var(--faint); }
    .subs-page .notice.ok     { border-left-color: var(--ok); }
    .subs-page .notice.ok svg { color: var(--ok); }
    .subs-page .notice.warn     { border-left-color: var(--warn); }
    .subs-page .notice.warn svg { color: var(--warn); }
    .subs-page .notice.danger     { border-left-color: var(--danger); }
    .subs-page .notice.danger svg { color: var(--danger); }
    .subs-page .notice code {
      font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      background: var(--surface-2); padding: 1px 5px; border-radius: 4px;
    }

    /* ── Tarjeta de estado ── */
    .subs-page .card {
      background: var(--glass);
      -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: 20px; box-shadow: var(--glass-shadow);
    }

    /* Sin soporte de backdrop-filter (Firefox antiguo, WebView viejo) el vidrio
       se vería transparente sobre los blobs: se cae a superficie sólida. */
    @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      .subs-page .card, .subs-page .notice, .subs-page .ghost-btn {
        background: var(--surface);
      }
    }
    .subs-page .state {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 28px; padding: 24px 26px; flex-wrap: wrap;
    }
    .subs-page .state-l { min-width: 260px; flex: 1; }

    .subs-page .status {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11.5px; font-weight: 600; letter-spacing: .09em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    }
    .subs-page .status .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--faint);
      box-shadow: 0 0 0 3px rgba(148, 163, 184, .18);
    }
    .subs-page .status.on  { color: var(--ok); }
    .subs-page .status.on .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(14, 155, 107, .16); }
    .subs-page .status.warn { color: var(--warn); }
    .subs-page .status.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(199, 124, 21, .16); }
    .subs-page .status.off { color: var(--danger); }
    .subs-page .status.off .dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(220, 38, 38, .14); }

    .subs-page .plan {
      font-size: 15px; font-weight: 600; color: var(--text);
      letter-spacing: -0.01em; margin-bottom: 8px;
    }
    .subs-page .amount {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px;
    }
    .subs-page .amount b {
      font-size: 40px; font-weight: 600; letter-spacing: -0.035em;
      color: var(--text); line-height: 1; font-variant-numeric: tabular-nums;
    }
    .subs-page .amount span { font-size: 13px; color: var(--muted); }
    .subs-page .blurb {
      font-size: 13.5px; color: var(--muted); line-height: 1.6;
      max-width: 58ch; margin: 0;
    }

    .subs-page .state-r {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 10px; min-width: 290px;
    }

    /* ── Zona de pago (botones del SDK de PayPal) ──
       Banda propia a lo ancho de la tarjeta y centrada: metidos en la columna
       derecha quedaban apretados contra el borde y descolocados respecto al
       resto. Los botones los pinta PayPal dentro de iframes: su aspecto es
       intocable (requisito de marca suyo), así que aquí solo se les da sitio,
       se centran y se les recortan los cantos. */
    .subs-page .payband {
      border-top: 1px solid var(--line-soft);
      padding: 24px 26px 26px;
      display: grid; justify-items: center; gap: 14px; text-align: center;
      /* El formulario de tarjeta crece dentro: nada de alturas fijas ni
         recortes aquí, o se saldría de la tarjeta al desplegarse. */
      overflow: visible;
    }
    /* Ancho de la zona de pago. Tope propio a propósito: la tarjeta va a todo
       el ancho del contenido, y PayPal pinta sus botones al ancho del
       contenedor, así que sin este límite quedarían estirados y ridículos.
       620px es el punto en que el módulo pesa sin deformarse. */
    .subs-page .pz { width: 100%; max-width: 620px; }
    .subs-page .pz-label {
      font-size: 11.5px; font-weight: 600; letter-spacing: .09em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 12px; text-align: center;
    }
    /* Caja de pago: superficie CLARA a propósito, en los dos temas.
       Los widgets de PayPal (botones y formulario de tarjeta) son iframes con
       fondo blanco que no podemos pintar — son de otro origen. Peleándose con
       ellos siempre asoma un canto blanco; enmarcándolos en una tarjeta clara,
       el blanco deja de ser un defecto y pasa a ser el material del módulo,
       como el teclado de un datáfono. */
    .subs-page .paybox {
      background: #FFFFFF;
      border: 1px solid rgba(15, 23, 42, .10);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 28px -14px rgba(8, 74, 100, .45);
    }
    [data-theme="dark"] .subs-page .paybox {
      background: #F7FAFC;
      border-color: rgba(255, 255, 255, .14);
      box-shadow: 0 14px 34px -16px rgba(0, 0, 0, .7);
    }

    .subs-page .pz-slots { min-height: 48px; display: grid; gap: 10px; }

    /* Pago único (SDK v5): cada botón va en un iframe con fondo BLANCO, así que
       sobre el cristal asomaban cuatro esquinas blancas. Su interior es de otro
       origen y no se puede pintar: se recorta desde fuera. `isolation` obliga a
       WebKit a crear el contexto de apilamiento, o el clip no llega al iframe.
       El bloque crece cuando el formulario de tarjeta se despliega dentro. */
    .subs-page .pz-slot {
      border-radius: 10px;
      overflow: hidden;
      /* WebKit no recorta iframes con overflow+border-radius: hace falta una
         máscara para que respete el radio (si no, asoman las esquinas). */
      -webkit-mask-image: -webkit-radial-gradient(#fff, #000);
      mask-image: radial-gradient(#fff, #000);
      isolation: isolate;
      min-height: 44px;
      /* El iframe es inline: sin esto queda una franja bajo el botón. */
      line-height: 0;
      font-size: 0;
    }
    .subs-page .pz-slot .paypal-buttons { margin: 0 !important; }

    /* <paypal-button> del SDK v6 es un componente propio, no un iframe: acepta
       nuestro radio por variable CSS. */
    .subs-page paypal-button {
      --paypal-button-border-radius: 10px;
      --paypal-mark-border-radius: 10px;
      display: block;
      width: 100%;
    }

    .subs-page .pz-hint {
      margin-top: 12px; font-size: 12px; color: var(--muted);
      line-height: 1.55; text-align: center;
      max-width: 52ch; margin-left: auto; margin-right: auto;
    }

    .subs-page .pz-loading {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      height: 48px; border: 1px dashed rgba(15, 23, 42, .12); border-radius: 12px;
      font-size: 12.5px; color: #64748B;
    }
    .subs-page .pz-note {
      margin-top: 10px; font-size: 11.5px; color: var(--faint);
      text-align: center; line-height: 1.5;
    }
    .subs-page .payband .pay-note { text-align: center; justify-content: center; }
    .subs-page .pay-note {
      display: flex; align-items: center; gap: 7px;
      font-size: 11.5px; color: var(--faint); text-align: right; line-height: 1.45;
    }
    .subs-page .pay-note svg { width: 12px; height: 12px; flex-shrink: 0; }
    .subs-page .pp { font-weight: 700; letter-spacing: -.02em; }
    .subs-page .pp .a { color: #003087; }
    .subs-page .pp .b { color: #009cde; }
    [data-theme="dark"] .subs-page .pp .a { color: #8AB4FF; }

    /* ── Tira de datos ── */
    .subs-page .facts {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line-soft);
    }
    .subs-page .fact { padding: 16px 26px; border-left: 1px solid var(--line-soft); }
    .subs-page .fact:first-child { border-left: 0; }
    .subs-page .fact .k {
      display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .1em;
      text-transform: uppercase; color: var(--faint); margin-bottom: 6px;
    }
    .subs-page .fact .v {
      display: block; font-size: 13.5px; font-weight: 500; color: var(--text);
      overflow-wrap: anywhere;
    }
    .subs-page .fact .s { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .subs-page .fact .v.mono {
      font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; letter-spacing: -.01em;
    }

    /* ── Cuerpo partido: datos a la izquierda, pago a la derecha ──
       Cuando hay algo que pagar, la banda de pago sola dejaba media tarjeta en
       blanco y la tira de datos quedaba relegada al pie. Se reparten el ancho:
       los datos en un 2×2 y el módulo de PayPal enfrente, separados por el
       mismo filo que ya divide el resto de la tarjeta. */
    .subs-page .split {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      border-top: 1px solid var(--line-soft);
    }
    .subs-page .split .facts {
      border-top: 0; grid-template-columns: 1fr 1fr;
      /* El pago manda en la altura: el bloque de datos se centra frente a él en
         vez de estirarse y dejar los rótulos flotando arriba. */
      align-content: center;
    }
    .subs-page .split .fact { padding: 18px 26px; border-left: 1px solid var(--line-soft); }
    .subs-page .split .fact:nth-child(2n+1) { border-left: 0; }
    .subs-page .split .fact:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
    .subs-page .split .payband {
      border-top: 0; border-left: 1px solid var(--line-soft);
      align-content: center;
    }

    /* ── Botones ── */
    .subs-page .btn {
      border: 1px solid transparent; border-radius: 10px;
      padding: 11px 18px; font-size: 13px; font-weight: 600; letter-spacing: .01em;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
      white-space: nowrap;
    }
    .subs-page .btn svg { width: 14px; height: 14px; }
    .subs-page .btn:disabled { opacity: .55; cursor: not-allowed; }
    /* ── Las dos vías de pago dentro de la caja blanca ──
       Colores fijos, sin variables de tema: esto vive dentro de .paybox, que es
       BLANCA en claro y en oscuro. Con el vidrio de la app los rótulos quedaban
       ilegibles y los botones grises, con pinta de deshabilitados. */
    .subs-page .pz-via { display: grid; gap: 9px; }
    .subs-page .pz-cap {
      font-size: 12px; line-height: 1.35; color: #64748B; text-align: center;
    }
    .subs-page .pz-cap b { color: #0F172A; font-weight: 650; }
    .subs-page .pz-btn + .pz-btn { margin-top: 8px; }
    /* Separador "o" entre una vía y otra, con su línea a cada lado. */
    .subs-page .pz-o {
      display: flex; align-items: center; gap: 12px;
      font-size: 11.5px; color: #94A3B8; text-transform: lowercase;
    }
    .subs-page .pz-o::before, .subs-page .pz-o::after {
      content: ''; flex: 1; height: 1px; background: #E2E8F0;
    }

    .subs-page .btn-primary { background: var(--accent); color: #fff; }
    .subs-page .btn-primary:hover:not(:disabled) { background: var(--accent-ink); }
    [data-theme="dark"] .subs-page .btn-primary { color: #06202A; }
    .subs-page .btn-quiet {
      background: transparent; border-color: var(--line); color: var(--text-2);
    }
    .subs-page .btn-quiet:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
    .subs-page .spin {
      width: 13px; height: 13px; border-radius: 50%;
      border: 2px solid currentColor; border-top-color: transparent;
      animation: sp-rot .7s linear infinite; opacity: .7;
    }
    @keyframes sp-rot { to { transform: rotate(360deg); } }

    /* ── Paneles ── */
    .subs-page .cols {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;
    }
    .subs-page .panel { padding: 22px 26px 24px; }
    .subs-page .panel h2 {
      font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .subs-page .panel h2 .n { font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--faint); font-weight: 500; }

    .subs-page .checks {
      list-style: none; margin: 0; padding: 0;
      display: grid; grid-template-columns: 1fr 1fr; gap: 11px 22px;
    }
    .subs-page .checks li {
      display: flex; align-items: flex-start; gap: 9px;
      font-size: 13px; color: var(--text-2); line-height: 1.45;
    }
    .subs-page .checks svg { width: 13px; height: 13px; color: var(--accent); flex-shrink: 0; margin-top: 3px; }
    /* Subtítulo de grupo dentro de "Qué incluye" (especialidad / plataforma). */
    .subs-page .checks-head {
      font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      color: var(--faint); margin: 0 0 12px;
    }
    .subs-page .checks + .checks-head {
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft);
    }

    /* ── Tabla de cobros ── */
    .subs-page table { width: 100%; border-collapse: collapse; }
    .subs-page thead th {
      font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: var(--faint); text-align: left; padding: 0 0 9px; border-bottom: 1px solid var(--line-soft);
    }
    .subs-page thead th.r { text-align: right; }
    .subs-page tbody td {
      padding: 12px 0; font-size: 13px; color: var(--text-2);
      border-bottom: 1px solid var(--line-soft);
    }
    .subs-page tbody tr:last-child td { border-bottom: 0; }
    .subs-page tbody td.date { color: var(--text); font-weight: 500; }
    .subs-page tbody td.r {
      text-align: right; font-variant-numeric: tabular-nums;
      color: var(--text); font-weight: 600;
    }
    .subs-page .tag {
      display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-ink);
    }
    .subs-page .tag.alt { background: rgba(199, 124, 21, .12); color: var(--warn); }
    /* El panel vacío estira con el de al lado (grid 1fr 1fr): se centra el texto
       para que no quede un bloque de aire debajo. */
    .subs-page .empty {
      display: grid; place-items: center; text-align: center; min-height: 150px;
      color: var(--faint); font-size: 12.5px; line-height: 1.7;
    }

    /* ── FAQ ── */
    .subs-page .faq {
      margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr;
      gap: 18px 40px; padding: 24px 26px;
    }
    .subs-page .faq h3 { font-size: 13px; font-weight: 600; color: var(--text); margin: 0 0 4px; }
    .subs-page .faq p { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin: 0; }

    .subs-page .foot {
      margin-top: 18px; display: flex; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; font-size: 11.5px; color: var(--faint);
    }

    /* ── Modal ──
       FUERA del scope .subs-page a propósito: el diálogo cuelga de <body> para
       que el scrim tape también la barra lateral (dentro de .layout-main, que
       hace de bloque contenedor, un position:fixed se quedaría recortado al
       área de contenido). Por eso tampoco usa las variables de .subs-page. */
    .sp-ov {
      position: fixed; inset: 0; z-index: 2000; padding: 1rem;
      background: rgba(15, 23, 42, .5);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      display: grid; place-items: center; animation: sp-in .18s ease;
      font-family: 'Poppins', system-ui, sans-serif;
    }
    @keyframes sp-in { from { opacity: 0; } to { opacity: 1; } }
    .sp-dlg {
      width: 100%; max-width: 420px;
      background: linear-gradient(135deg, rgba(255, 255, 255, .94) 0%, rgba(240, 249, 255, .88) 100%);
      -webkit-backdrop-filter: saturate(160%) blur(20px); backdrop-filter: saturate(160%) blur(20px);
      border: 1px solid rgba(255, 255, 255, .6); border-radius: 20px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .6);
    }
    .sp-dlg h3 { margin: 0; padding: 22px 24px 0; font-size: 16px; font-weight: 600; color: #0F172A; }
    .sp-dlg p { margin: 8px 0 0; padding: 0 24px; font-size: 13px; color: #64748B; line-height: 1.6; }
    .sp-dlg .row { display: flex; justify-content: flex-end; gap: 9px; padding: 20px 24px 22px; }
    .sp-dlg button {
      font: inherit; cursor: pointer; border: 1px solid transparent; border-radius: 10px;
      padding: 11px 18px; font-size: 13px; font-weight: 600;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .sp-dlg .go { background: #0891B2; color: #fff; }
    .sp-dlg .go:hover { background: #0E7490; }
    .sp-dlg .keep { background: transparent; border-color: #E6EBF0; color: #475569; }
    .sp-dlg .keep:hover { border-color: #94A3B8; }

    [data-theme="dark"] .sp-dlg {
      background: linear-gradient(135deg, rgba(24, 24, 27, .88) 0%, rgba(16, 16, 19, .82) 100%);
      border-color: rgba(255, 255, 255, .08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .05);
    }
    [data-theme="dark"] .sp-dlg h3 { color: #F1F5F9; }
    [data-theme="dark"] .sp-dlg p { color: #94A3B8; }
    [data-theme="dark"] .sp-dlg .go { background: #22D3EE; color: #06202A; }
    [data-theme="dark"] .sp-dlg .go:hover { background: #67E8F9; }
    [data-theme="dark"] .sp-dlg .keep { border-color: rgba(255, 255, 255, .12); color: #CBD5E1; }

    @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      .sp-dlg { background: #fff; }
      [data-theme="dark"] .sp-dlg { background: #121214; }
    }

    /* ── Carga ── */
    .subs-page .loading {
      min-height: 300px; display: grid; place-items: center; gap: 12px;
      color: var(--faint); font-size: 13px;
    }
    .subs-page .loading .spin { width: 24px; height: 24px; border-width: 2.5px; color: var(--accent); }

    .subs-page .in { animation: sp-up .4s cubic-bezier(.2, .7, .2, 1) both; }
    .subs-page .in.d1 { animation-delay: .04s; }
    .subs-page .in.d2 { animation-delay: .09s; }
    @keyframes sp-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    @media (max-width: 1000px) {
      .subs-page .cols, .subs-page .faq { grid-template-columns: 1fr; }
      .subs-page .facts { grid-template-columns: 1fr 1fr; }
      .subs-page .fact:nth-child(3) { border-left: 0; }
      .subs-page .fact:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
      /* Apilado: el pago vuelve arriba (es la acción) y los datos debajo. */
      .subs-page .split { grid-template-columns: 1fr; }
      .subs-page .split .payband { order: -1; border-left: 0; }
      .subs-page .split .facts { border-top: 1px solid var(--line-soft); }
    }
    @media (max-width: 640px) {
      .subs-page .state { padding: 20px; gap: 18px; }
      .subs-page .state-r { align-items: stretch; width: 100%; }
      .subs-page .state-r .btn { width: 100%; }
      .subs-page .pay-note { text-align: left; }
      .subs-page .facts, .subs-page .split .facts { grid-template-columns: 1fr; }
      .subs-page .fact, .subs-page .split .fact {
        border-left: 0 !important; border-top: 1px solid var(--line-soft); padding: 14px 20px;
      }
      .subs-page .fact:first-child { border-top: 0; }
      .subs-page .panel, .subs-page .faq { padding: 20px; }
      .subs-page .checks { grid-template-columns: 1fr; }
      .subs-page .amount b { font-size: 34px; }
    }
  </style>
</head>
<body>

<main class="layout-main">
  <div class="subs-page" id="subsRoot">
    <div class="loading">
      <div class="spin"></div>
      <span>Cargando tu suscripción…</span>
    </div>
  </div>
</main>

<script src="/icons.js"></script>
<script src="/common.js"></script>
<script src="/layout.js"></script>
<script>
  // La recepcionista entra en modo lectura (para entender por qué está bloqueada
  // la app), pero solo el dueño de la cuenta puede contratar o cancelar.
  requireAuth(['clinic_admin', 'doctor', 'receptionist']);

  const ROOT = document.getElementById('subsRoot');

  /* ── Iconos inline (mismos trazos que el resto de la plataforma) ── */
  const I = {
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0114.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0020.5 15"/></svg>',
    check:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg>',
    lock:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
    alert:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>',
    info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    ok:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg>'
  };

  const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  /* ── Lo que incluye la suscripción (una sola, todo dentro) ──
     La lista se arma en dos partes: primero lo propio de la especialidad de la
     clínica —lo que el doctor abre en cada consulta— y debajo lo general de la
     plataforma, que es igual para todos. La especialidad la manda
     /api/billing/status (la del usuario o, si no tiene, la del doctor de la
     clínica); si no se reconoce, solo se pinta la parte general en vez de
     prometer funciones de otra especialidad. */
  const FEATURES_BASE = [
    'Expediente clínico digital ilimitado',
    'Agenda de citas y calendario',
    // Recordatorios desactivado — duplicaba Confirmaciones. Para reactivar,
    // volver a 'Recordatorios y confirmaciones por WhatsApp':
    'Confirmaciones de cita por WhatsApp',
    'Consentimientos informados con firma',
    'Finanzas y facturación',
    // Inventario desactivado — para reactivar, descomentar esta línea:
    // 'Inventario y control de insumos',
    'Portal del paciente',
    // No se venden cuentas de clínica: el sitio web público solo lo edita un
    // clinic_admin desde Mi Sitio Web, así que prometerlo en un plan individual
    // es vender algo a lo que el doctor no llega. Para reactivar, descomentar:
    // 'Sitio web público de la clínica',
    'Citas online para tus pacientes',
    'Respaldo en la nube y auditoría',
    'Actualizaciones y soporte incluidos'
  ];

  // Las especialidades se guardan como texto libre y con mil variantes
  // ('Podología', 'podologia', 'odontologia'…), así que se reconocen por
  // prefijo sobre la cadena sin acentos ni mayúsculas, en orden: la primera
  // regla que case manda. Añadir una especialidad nueva = añadir una entrada.
  const FEATURES_ESPECIALIDAD = [
    {
      re: /^podolog/, nombre: 'Podología',
      items: [
        'Ficha clínica podológica completa',
        'Podograma: tipo y forma de pie por lado',
        'Exploración dermatológica y ungueal del pie',
        'Exploración del pie diabético con monofilamento',
        'Índice tobillo-brazo (ITB) y termografía plantar',
        'Registro de calzado y antecedentes del paciente',
        'Citas de pedicure clínico, onicocriptosis y onicomicosis',
        'Fotos clínicas y procedimientos por consulta'
      ]
    },
    {
      re: /^odontopediatr/, nombre: 'Odontopediatría',
      items: [
        'Odontograma de dentición mixta (temporal y permanente)',
        'Índices ceo-d y CPO-D calculados solos',
        'Procedimientos por diente y por superficie',
        'Radiografías e imágenes de la consulta'
      ]
    },
    {
      re: /^periodon/, nombre: 'Periodoncia',
      items: [
        'Periodontograma interactivo con diagnóstico',
        'Odontograma interactivo por superficie',
        'Procedimientos por diente y control de evolución',
        'Radiografías e imágenes de la consulta'
      ]
    },
    {
      re: /^ortodon/, nombre: 'Ortodoncia',
      items: [
        'Diagrama ortodóncico del tratamiento',
        'Odontograma interactivo por superficie',
        'Control de citas y avance por fases',
        'Radiografías e imágenes de la consulta'
      ]
    },
    {
      re: /^(odontolog|dental)/, nombre: 'Odontología',
      items: [
        'Odontograma interactivo por superficie',
        'Periodontograma con diagnóstico',
        'Procedimientos por diente y presupuesto',
        'Radiografías e imágenes de la consulta'
      ]
    },
    {
      re: /^dermatolog/, nombre: 'Dermatología',
      items: [
        'Mapa corporal de lesiones por zona',
        'Seguimiento fotográfico de cada lesión',
        'Diagnóstico y plan de manejo por consulta'
      ]
    },
    {
      re: /^nutric/, nombre: 'Nutrición',
      items: [
        'Historia clínica nutricional y antropometría',
        'Plan alimentario con alimentos hondureños',
        'Seguimiento de peso y medidas por consulta'
      ]
    },
    {
      re: /^(general|medicina)/, nombre: 'Medicina general',
      items: [
        'Ficha de consulta con signos vitales',
        'Exploración física, diagnóstico y plan',
        'Imágenes y adjuntos de la consulta'
      ]
    }
  ];

  function normalizarEspecialidad(v) {
    return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }
  function featuresDeEspecialidad(v) {
    const n = normalizarEspecialidad(v);
    if (!n) return null;
    return FEATURES_ESPECIALIDAD.find(e => e.re.test(n)) || null;
  }

  let state = { status: null, payments: [], banner: null, busy: '' };

  /* ── Formato ── */
  function money(amount, currency) {
    const value = Number(amount || 0);
    try {
      return new Intl.NumberFormat('en-US', {
        style: 'currency', currency: currency || 'USD', minimumFractionDigits: 2
      }).format(value);
    } catch (_) {
      return '$' + value.toFixed(2);
    }
  }
  function fechaCorta(d) { return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear(); }
  function diasHasta(d) { return Math.max(0, Math.round((d.getTime() - Date.now()) / 86400000)); }

  /* ── Estado legible ── */
  function estado(st) {
    const sub = st.subscription;
    // Estados canónicos del sistema (los mismos con cualquier procesador).
    const status = sub ? String(sub.status || '').toLowerCase() : null;
    const pagada = st.access.paid;

    if (!sub || status === 'expired') {
      return { key: 'none', label: 'Sin suscripción', tone: 'off',
        blurb: 'Activa la suscripción mensual para usar Salud Digital sin interrupciones. Puedes cancelarla cuando quieras.' };
    }
    if (status === 'active' || status === 'trialing') {
      return {
        key: 'active',
        label: status === 'trialing' ? 'En prueba' : 'Activa',
        tone: 'on',
        blurb: 'Tu suscripción está al día. El cobro se renueva solo cada mes y el recibo te llega por correo.',
      };
    }
    if (status === 'incomplete') {
      return { key: 'pending', label: 'Pendiente', tone: 'warn',
        blurb: 'Empezaste el proceso de pago pero aún no se confirmó. Puedes retomarlo cuando quieras.' };
    }
    if (status === 'past_due') {
      return { key: 'suspended', label: 'Pago pendiente', tone: 'warn',
        blurb: 'No se pudo cobrar la última renovación y lo estamos reintentando. Revisa tu método de pago para no perder el acceso.' };
    }
    if (status === 'payment_failed') {
      return { key: 'suspended', label: 'Cobro fallido', tone: 'warn',
        blurb: 'Se agotaron los reintentos de cobro. Vuelve a suscribirte para reactivar el acceso; tus datos siguen intactos.' };
    }
    if (status === 'paused') {
      return { key: 'suspended', label: 'En pausa', tone: 'warn',
        blurb: 'Tu suscripción está pausada. Reactívala cuando quieras.' };
    }
    if (status === 'cancelled') {
      return { key: 'cancelled', label: 'Cancelada', tone: pagada ? 'warn' : 'off',
        blurb: pagada
          ? 'Cancelaste la renovación automática. Conservas el acceso hasta que termine el mes que ya pagaste.'
          : 'Tu suscripción está cancelada. Puedes reactivarla en cualquier momento; tus datos siguen intactos.' };
    }
    return { key: 'other', label: status || 'Desconocido', tone: 'off', blurb: 'Estado reportado por el procesador de pagos.' };
  }

  /* ── Render ── */
  function render() {
    const st = state.status;
    if (!st) return;
    const sub = st.subscription;
    const e = estado(st);
    const owner = st.can_manage;

    // Con pago pendiente la tarjeta se parte en dos columnas (datos | PayPal);
    // ya suscrito no hay módulo de pago, así que la tira de datos ocupa el
    // ancho completo como antes.
    const payband = renderPayBand(st, e, owner);
    const facts = renderFacts(st, sub, e);
    const cuerpo = payband ? `<div class="split">${facts}${payband}</div>` : facts;

    ROOT.innerHTML = `
      <div class="head in">
        <div>
          <h1>Suscripción</h1>
          <p>Plan individual de Salud Digital · cobro mensual con PayPal.</p>
        </div>
        ${owner && sub ? `<button class="ghost-btn" id="btnSync" ${state.busy === 'sync' ? 'disabled' : ''}>
          ${state.busy === 'sync' ? '<span class="spin"></span> Actualizando' : I.refresh + ' Actualizar estado'}
        </button>` : ''}
      </div>

      ${renderBanner()}
      ${renderConfigWarning(st, owner)}

      <section class="card in d1">
        <div class="state">
          <div class="state-l">
            <div class="status ${e.tone}"><span class="dot"></span>${esc(e.label)}</div>
            <div class="plan">Plan Individual</div>
            <div class="amount">
              <b>${money(st.price, st.currency)}</b>
              <span>${esc(st.currency)} al mes${e.key === 'active' ? ' · renovación automática' : ''}</span>
            </div>
            <p class="blurb">${esc(e.blurb)}</p>
          </div>
          <div class="state-r">
            ${renderActions(st, e, owner)}
          </div>
        </div>
        ${cuerpo}
      </section>

      <div class="cols in d2">
        <section class="card panel">
          ${renderIncluye(st.specialty)}
        </section>

        <section class="card panel">
          <h2>Historial de pagos ${state.payments.length ? `<span class="n">${state.payments.length} cobro${state.payments.length === 1 ? '' : 's'}</span>` : ''}</h2>
          ${renderPayments()}
        </section>
      </div>

      <section class="card faq in d2">
        <div>
          <h3>¿Cuándo se hace el cobro?</h3>
          <p>El primero al suscribirte y luego cada mes en la misma fecha. PayPal envía el recibo a tu correo.</p>
        </div>
        <div>
          <h3>¿Qué pasa si cancelo?</h3>
          <p>Conservas el acceso hasta que termine el mes que ya pagaste. Tus datos clínicos no se borran.</p>
        </div>
        <div>
          <h3>¿Necesito cuenta de PayPal?</h3>
          <p>No necesariamente: PayPal permite pagar con tarjeta de crédito o débito sin abrir una cuenta, según tu país.</p>
        </div>
        <div>
          <h3>¿Y si falla un cobro?</h3>
          <p>PayPal reintenta. Tras varios intentos fallidos la suscripción se suspende y el acceso queda en pausa hasta regularizarlo.</p>
        </div>
      </section>

      <div class="foot in d2">
        <span>Precios en ${esc(st.currency)}${st.environment === 'sandbox' ? ' · entorno de pruebas' : ''}.</span>
        <span>¿Dudas? contacto@saluddigital.hn</span>
      </div>
    `;

    wire();
  }

  function renderBanner() {
    if (!state.banner) return '';
    const b = state.banner;
    const ic = b.tone === 'ok' ? I.ok : (b.tone === 'danger' || b.tone === 'warn') ? I.alert : I.info;
    return `<div class="notice ${b.tone} in">${ic}<div><b>${esc(b.title)}</b>${esc(b.text)}</div></div>`;
  }

  // Aviso solo para el dueño: la plataforma está desplegada sin credenciales de
  // PayPal, así que el botón de suscripción no puede funcionar todavía.
  function renderConfigWarning(st, owner) {
    if (!owner || (st.configured && st.plan_ready)) return '';
    return `<div class="notice warn in">${I.alert}<div>
      <b>El procesador de pagos aún no está configurado</b>
      Faltan las credenciales del procesador de pagos en el servidor.
      Revisa las variables de entorno descritas en <code>docs/PAYMENTS.md</code>.
    </div></div>`;
  }

  // Tira de 4 datos bajo la tarjeta. Cambia según el estado para que nunca
  // queden huecos vacíos: sin suscripción se explican las condiciones.
  function renderFacts(st, sub, e) {
    const facts = [];

    const proximo = sub && (sub.next_billing_at || sub.current_period_end);
    if (sub && e.key === 'active' && proximo) {
      const d = new Date(proximo);
      facts.push({ k: 'Próximo cobro', v: fechaCorta(d), s: 'en ' + diasHasta(d) + ' día' + (diasHasta(d) === 1 ? '' : 's') });
    } else if (sub && st.access.paid && sub.current_period_end) {
      facts.push({ k: 'Acceso hasta', v: fechaCorta(new Date(sub.current_period_end)), s: 'después se pausa' });
    } else {
      facts.push({ k: 'Ciclo', v: 'Mensual', s: 'renovación automática' });
    }

    if (sub && sub.subscriber_email) facts.push({ k: 'Cuenta de pago', v: sub.subscriber_email });
    else facts.push({ k: 'Método de pago', v: 'Tarjeta o PayPal', s: 'lo procesa la pasarela' });

    if (sub && sub.created_at) facts.push({ k: 'Suscrito desde', v: fechaCorta(new Date(sub.created_at)) });
    else facts.push({ k: 'Permanencia', v: 'Ninguna', s: 'cancela cuando quieras' });

    if (sub && sub.id) facts.push({ k: 'ID de suscripción', v: sub.id, mono: true });
    else facts.push({ k: 'Facturación', v: 'Recibo por correo', s: 'lo envía PayPal' });

    return `<div class="facts">
      ${facts.map(f => `<div class="fact">
        <span class="k">${esc(f.k)}</span>
        <span class="v${f.mono ? ' mono' : ''}">${esc(f.v)}</span>
        ${f.s ? `<span class="s">${esc(f.s)}</span>` : ''}
      </div>`).join('')}
    </div>`;
  }

  function renderActions(st, e, owner) {
    if (!owner) {
      return `<div class="pay-note">${I.info}<span>Solo el administrador de la cuenta puede gestionar la suscripción.</span></div>`;
    }

    // Solo la suscripción activa tiene acción en esta columna (cancelar). Todo
    // lo relativo a PAGAR vive en su propia banda centrada, más abajo.
    if (e.key !== 'active') return '';

    return `<button class="btn btn-quiet" id="btnCancel" ${state.busy === 'cancel' ? 'disabled' : ''}>
        ${state.busy === 'cancel' ? '<span class="spin"></span> Cancelando' : 'Cancelar suscripción'}
      </button>
      ${NOTA_SEGURO}`;
  }

  const NOTA_SEGURO = `<div class="pay-note">${I.lock}<span>Pago procesado por <span class="pp"><span class="a">Pay</span><span class="b">Pal</span></span>. Nunca vemos tu tarjeta.</span></div>`;

  // Banda de pago: ocupa el ancho de la tarjeta y va centrada. Aquí se montan
  // los botones del SDK (cuenta de PayPal / tarjeta) o, si no se puede, el
  // botón clásico que abre el pago fuera.
  function renderPayBand(st, e, owner) {
    if (!owner || e.key === 'active') return '';

    const puede = st.configured && st.plan_ready;
    const cargando = state.busy === 'subscribe';

    // Qué vías de pago hay. Con las dos activas el texto no puede prometer ni
    // "se cobra solo" ni "pagas cada mes": depende de cuál elija el doctor.
    const vias = (st.checkouts && st.checkouts.length ? st.checkouts : [st.checkout]).filter(Boolean);
    const hayAuto = vias.some((c) => c.checkout === 'provider_hosted');
    const hayManual = vias.some((c) => c.checkout === 'inline_card');
    const manual = hayManual && !hayAuto;
    const ambas = hayAuto && hayManual;

    const titulo = manual
      ? (e.key === 'suspended' ? 'Renovar · ' + money(st.price, st.currency)
                               : 'Pagar el mes · ' + money(st.price, st.currency))
      : e.key === 'pending' ? 'Termina tu pago'
      : (e.key === 'cancelled' || e.key === 'suspended') ? 'Reactivar por ' + money(st.price, st.currency) + ' al mes'
      : money(st.price, st.currency) + ' al mes · elige cómo pagar';

    // En la app de escritorio (Tauri) no se usa el SDK: sus ventanas emergentes
    // no funcionan bien dentro del WKWebView empaquetado, así que ahí el pago
    // se abre en el navegador del sistema.
    if (!puede || esApp()) {
      const texto = e.key === 'pending' ? 'Continuar con PayPal'
        : (e.key === 'cancelled' || e.key === 'suspended') ? 'Reactivar suscripción'
        : 'Suscribirme por ' + money(st.price, st.currency) + '/mes';
      return `<div class="payband">
          <div class="pz">
            <div class="pz-label">${esc(titulo)}</div>
            <button class="btn btn-primary" id="btnSubscribe" style="width:100%" ${cargando || !puede ? 'disabled' : ''}>
              ${cargando ? '<span class="spin"></span> Conectando…' : esc(texto)}
            </button>
          </div>
          ${NOTA_SEGURO}
        </div>`;
    }

    return `<div class="payband">
        <div class="pz">
          <div class="pz-label">${esc(titulo)}</div>
          <div class="paybox">
            <div class="pz-slots" id="pzSlots">
              <div class="pz-loading" id="pzLoading"><span class="spin"></span> Cargando el pago…</div>
            </div>
          </div>
          <div class="pz-hint">${ambas
            ? 'Con cuenta de PayPal se te cobra solo cada mes. Con tarjeta pagas mes a mes y te avisamos antes de que venza; no guardamos tu tarjeta. En ambos casos cancelas cuando quieras.'
            : manual
            ? 'Paga con tarjeta de crédito o débito sin salir de esta pantalla. Cada mes te avisaremos para renovar; no se guarda tu tarjeta ni se te cobra solo.'
            : 'Con tu cuenta de PayPal, o con tarjeta de crédito o débito sin crear cuenta. Se cobra automáticamente cada mes y puedes cancelar cuando quieras.'}</div>
          <div class="pz-note" id="pzNote" hidden></div>
        </div>
        ${NOTA_SEGURO}
      </div>`;
  }

  // "Qué incluye": lo de la especialidad de la clínica arriba (es lo que
  // diferencia a esta cuenta) y lo general de la plataforma debajo. Sin
  // especialidad reconocida se pinta solo la parte general.
  function renderIncluye(specialty) {
    const esp = featuresDeEspecialidad(specialty);
    const lista = items => `<ul class="checks">${items.map(f => `<li>${I.check}<span>${esc(f)}</span></li>`).join('')}</ul>`;
    return `
      <h2>Qué incluye</h2>
      ${esp ? `<div class="checks-head">Para ${esc(esp.nombre.toLowerCase())}</div>${lista(esp.items)}
      <div class="checks-head">En toda la plataforma</div>` : ''}
      ${lista(FEATURES_BASE)}
    `;
  }

  function renderPayments() {
    if (!state.status.can_manage) return `<div class="empty">Sin acceso al historial.</div>`;
    if (!state.payments.length) {
      return `<div class="empty">Todavía no hay cobros registrados.<br>Aparecerán aquí en cuanto PayPal procese el primero.</div>`;
    }
    return `<table>
      <thead><tr><th>Fecha</th><th>Estado</th><th class="r">Importe</th></tr></thead>
      <tbody>
        ${state.payments.map(p => {
          const d = new Date(p.paid_at);
          const st = String(p.status).toLowerCase();
          const completo = st === 'succeeded';
          const ESTADOS = { succeeded: 'Pagado', failed: 'Fallido', refunded: 'Reembolsado',
                            reversed: 'Revertido', cancelled: 'Cancelado', pending: 'Pendiente' };
          return `<tr>
            <td class="date">${fechaCorta(d)}</td>
            <td><span class="tag ${completo ? '' : 'alt'}" ${p.failure_message ? `title="${esc(p.failure_message)}"` : ''}>${esc(ESTADOS[st] || st)}</span></td>
            <td class="r">${money(p.amount, p.currency)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }

  /* ── Acciones ── */
  function wire() {
    const sync = document.getElementById('btnSync');
    if (sync) sync.onclick = doSync;
    const sub = document.getElementById('btnSubscribe');
    if (sub) sub.onclick = doSubscribe;
    const cancel = document.getElementById('btnCancel');
    if (cancel) cancel.onclick = openCancelModal;
    if (document.getElementById('pzSlots')) montarPaypal();
  }

  /* ══════════ Pago dentro de la página (SDK v6 de PayPal) ══════════
     `presentationMode: 'modal'` abre el checkout como una CAPA sobre esta
     página — sin ventana emergente, sin salir de la app. Dentro de esa capa el
     usuario elige cuenta de PayPal o tarjeta de crédito/débito como invitado.

     Por qué v6 y no la v5: la v5 solo sabe abrir ventana emergente y pintaba
     sus botones en iframes con fondo blanco (esquinas blancas sobre nuestro
     cristal). La v6 usa componentes estilables y deja elegir la presentación.

     Aviso de PayPal sobre 'modal': depende de cookies de terceros, que Safari
     restringe. Si alguna vez el checkout no abriera o quedara en blanco, el
     cambio es una línea — 'auto' vuelve a intentar ventana emergente primero.

     Los campos de tarjeta dentro de NUESTRO html (`card-fields`) siguen sin ser
     opción: PayPal solo los admite para pedidos sueltos, no para suscripciones. */

  function esApp() {
    return !!(window.__TAURI__ || window.__TAURI_INTERNALS__);
  }

  // ── Cargador del SDK v5 ──
  // La página ofrece las DOS formas de pagar, y cada una necesita el SDK con
  // parámetros distintos (suscripción: vault+subscription · pago único:
  // capture). Cargarlo dos veces solo funciona con data-namespace: sin él, el
  // segundo script pisa window.paypal del primero y una de las dos deja de
  // responder. Por eso cada modo vive en su propia variable global.
  const sdks = {};
  function cargarSdk({ clientId, namespace, params }) {
    if (sdks[namespace]) return sdks[namespace];
    sdks[namespace] = new Promise((resolve, reject) => {
      if (window[namespace] && window[namespace].Buttons) return resolve(window[namespace]);
      const q = new URLSearchParams(Object.assign({
        'client-id': clientId,
        locale: 'es_ES',
        components: 'buttons',
        'enable-funding': 'card',
        'disable-funding': 'paylater',
      }, params));
      const s = document.createElement('script');
      s.src = 'https://www.paypal.com/sdk/js?' + q.toString();
      s.async = true;
      s.setAttribute('data-namespace', namespace);
      s.onload = () => (window[namespace] && window[namespace].Buttons)
        ? resolve(window[namespace])
        : reject(new Error('El SDK cargó sin Buttons (' + namespace + ')'));
      s.onerror = () => reject(new Error('No se pudo cargar el SDK de PayPal'));
      document.head.appendChild(s);
    });
    return sdks[namespace];
  }

  /**
   * Pinta los botones de UNA vía de pago. Devuelve cuántos quedaron en pie.
   * Cada vía enseña solo el botón que le corresponde: el dorado en la
   * suscripción y el de tarjeta en el pago mes a mes. Enseñar los dos en ambas
   * era ofrecer cuatro botones para dos decisiones, y el rótulo de cada bloque
   * dejaba de significar nada.
   */
  function pintarBotones(pp, contenedorId, fuentes, acciones) {
    const cont = document.getElementById(contenedorId);
    if (!cont) return 0;
    cont.innerHTML = fuentes.map((_, i) => '<div class="pz-btn" data-i="' + i + '"></div>').join('');
    let pintados = 0;
    for (const [i, [fuente, estilo]] of fuentes.entries()) {
      const el = cont.querySelector('[data-i="' + i + '"]');
      if (!el) continue;
      let botones;
      try {
        botones = pp.Buttons(Object.assign(
          { fundingSource: fuente, style: Object.assign({ shape: 'rect', height: 44 }, estilo) },
          acciones,
        ));
      } catch (_) { el.remove(); continue; }
      // isEligible: PayPal decide si esa vía aplica al comprador (país, moneda).
      if (!botones.isEligible()) { el.remove(); continue; }
      botones.render(el).catch(() => {});
      pintados++;
    }
    return pintados;
  }

  // ── Vía B: PAGO ÚNICO del periodo (tarjeta sin crear cuenta) ──
  // La orden se crea AL PULSAR, no al cargar la página: cada llamada a /order
  // puede dar de alta una suscripción nueva en la base de datos, y crear una
  // fila por cada visita a la pantalla llenaba la tabla de intentos muertos.
  async function montarPagoUnico(st, cfg) {
    let pp;
    try {
      pp = await cargarSdk({
        clientId: cfg.client_id,
        namespace: 'ppUnico',
        params: { intent: 'capture', currency: st.currency },
      });
    } catch (err) {
      console.warn('[pago único]', err.message);
      return 0;
    }

    return pintarBotones(pp, 'pzManual', [[pp.FUNDING.CARD, { color: 'black' }]], {
      // El importe NO viaja desde aquí: lo pone el servidor según el plan.
      createOrder: () =>
        api('/api/billing/order', { method: 'POST', body: { plan_code: st.plan_code, provider: cfg.provider } })
          .then((r) => r.order_id),

      onApprove: async (data) => {
        // Sin re-render aquí dentro: destruiría el iframe que ejecuta esto.
        notaPago('Confirmando el pago…');
        try {
          const r = await api('/api/billing/capture', {
            method: 'POST',
            body: { order_id: data.orderID, provider: cfg.provider },
          });
          await load();
          const hasta = r.subscription && r.subscription.current_period_end;
          banner('ok', 'Pago recibido',
            'Tu suscripción queda activa' + (hasta ? ' hasta el ' + fechaCorta(new Date(hasta)) : '') +
            '. Te avisaremos antes de que toque renovar.');
        } catch (err) {
          banner('danger', 'No se pudo confirmar el pago',
            err.message || 'Si se te cobró, usa "Actualizar estado" o escríbenos.');
        }
        render();
      },

      onCancel: () => { notaPago(''); render(); },

      onError: (err) => {
        console.error('[pago único]', err);
        banner('danger', 'No se pudo procesar el pago', 'Revisa los datos e inténtalo de nuevo.');
        render();
      },
    });
  }

  function notaPago(texto) {
    const nota = document.getElementById('pzNote');
    if (!nota) return;
    nota.hidden = !texto;
    nota.textContent = texto || '';
  }

  function fallbackRedireccion(slots, st, motivo) {
    console.warn('[paypal]', motivo);
    slots.innerHTML = `<button class="btn btn-primary" id="btnSubscribe" style="width:100%">Suscribirme por ${money(st.price, st.currency)}/mes</button>`;
    const b = document.getElementById('btnSubscribe');
    if (b) b.onclick = doSubscribe;
    notaPago('El pago se abrirá en otra pantalla de PayPal.');
  }

  // ── Vía A: SUSCRIPCIÓN automática (PayPal cobra cada mes) ──
  async function montarSuscripcion(st, cfg) {
    let pp;
    try {
      pp = await cargarSdk({
        clientId: cfg.client_id,
        namespace: 'ppSuscripcion',
        params: { vault: 'true', intent: 'subscription' },
      });
    } catch (err) {
      console.warn('[suscripción]', err.message);
      return 0;
    }

    return pintarBotones(pp, 'pzAuto', [[pp.FUNDING.PAYPAL, { color: 'gold', label: 'subscribe' }]], {
      // La suscripción la crea NUESTRO servidor contra PayPal; al SDK solo se le
      // entrega el id. Así el plan y el importe nunca vienen del navegador.
      createSubscription: () =>
        api('/api/billing/subscribe', { method: 'POST', body: { plan_code: st.plan_code, provider: cfg.provider } })
          .then((r) => r.subscription_id),

      onApprove: async (data) => {
        // Sin re-render aquí dentro: destruiría el iframe que ejecuta esto.
        notaPago('Confirmando el pago con PayPal…');
        try {
          const r = await api('/api/billing/confirm', {
            method: 'POST',
            // v5 lo llama subscriptionID (con ID en mayúsculas); se acepta la
            // otra grafía por si algún día cambia el SDK.
            body: { subscription_id: data.subscriptionID || data.subscriptionId },
          });
          let activa = r.access && r.access.active;
          // La activación puede tardar unos segundos en PayPal.
          for (let intento = 0; !activa && intento < 4; intento++) {
            await new Promise((res) => setTimeout(res, 2500));
            try {
              const s = await api('/api/billing/sync', { method: 'POST', body: {} });
              activa = s.access && s.access.active;
            } catch (_) { break; }
          }
          await load();
          if (activa) {
            banner('ok', 'Suscripción activada',
              'PayPal cobrará ' + money(st.price, st.currency) + ' cada mes automáticamente. Ya tienes acceso completo a la plataforma.');
          } else {
            banner('warn', 'PayPal aún está confirmando el pago',
              'Puede tardar unos minutos. Usa "Actualizar estado" para volver a consultar.');
          }
        } catch (err) {
          banner('danger', 'No se pudo confirmar la suscripción',
            err.message || 'Consulta el estado con el botón "Actualizar estado".');
        }
        render();
      },

      onCancel: () => {
        notaPago('');
        banner('warn', 'Pago cancelado', 'Cerraste el pago sin terminar. No se te ha cobrado nada.');
        render();
      },

      onError: (err) => {
        console.error('[suscripción]', err);
        banner('danger', 'PayPal no pudo procesar el pago',
          'Intenta de nuevo en unos minutos; si sigue fallando, escríbenos.');
        render();
      },
    });
  }

  // ── Zona de pago: las DOS vías, una debajo de otra ──
  //
  // PayPal no da las dos cosas a la vez y hay que decirlo claro en la pantalla:
  //   · Suscripción → cobra solo cada mes, pero EXIGE cuenta de PayPal.
  //   · Pago único  → acepta cualquier tarjeta sin crear cuenta, pero cada mes
  //                   lo tiene que pagar el cliente a mano.
  // Ofrecer solo una dejaba fuera a media clientela: al doctor sin cuenta de
  // PayPal, o al que no quiere estar pendiente de renovar. Los rótulos van en
  // NUESTRO html porque PayPal cambia el texto de sus botones entre cargas —a
  // veces "Tarjeta de débito o crédito", a veces solo el icono— y su marca no
  // permite reetiquetarlos.
  async function montarPaypal() {
    const st = state.status;
    const slots = document.getElementById('pzSlots');
    if (!slots || slots.dataset.montado) return;
    slots.dataset.montado = '1';

    const vias = (st.checkouts && st.checkouts.length ? st.checkouts : [st.checkout]).filter(Boolean);
    const auto = vias.find((c) => c && c.checkout === 'provider_hosted');
    const manual = vias.find((c) => c && c.checkout === 'inline_card');

    if (!auto && !manual) {
      fallbackRedireccion(slots, st, 'ningún método de pago configurado');
      return;
    }

    slots.innerHTML =
      (auto ? '<div class="pz-via" id="viaAuto">' +
        '<div class="pz-cap"><b>Cobro automático</b> · necesitas cuenta de PayPal</div>' +
        '<div id="pzAuto"></div></div>' : '') +
      (auto && manual ? '<div class="pz-o"><span>o</span></div>' : '') +
      (manual ? '<div class="pz-via" id="viaManual">' +
        '<div class="pz-cap"><b>Pago mes a mes</b> · con tarjeta, sin crear cuenta</div>' +
        '<div id="pzManual"></div></div>' : '');

    const pintados =
      (auto ? await montarSuscripcion(st, auto) : 0) +
      (manual ? await montarPagoUnico(st, manual) : 0);

    // Una vía que no pintó ni un botón se retira entera, con su rótulo: dejar el
    // título de una opción que no existe es peor que no ofrecerla.
    for (const [id, cont] of [['viaAuto', 'pzAuto'], ['viaManual', 'pzManual']]) {
      const bloque = document.getElementById(id);
      const dentro = document.getElementById(cont);
      if (bloque && (!dentro || !dentro.querySelector('.pz-btn'))) bloque.remove();
    }
    if (document.querySelectorAll('.pz-via').length < 2) {
      const o = slots.querySelector('.pz-o');
      if (o) o.remove();
    }

    if (!pintados) fallbackRedireccion(slots, st, 'ningún método de pago elegible');
  }

  function banner(tone, title, text) { state.banner = { tone, title, text }; }

  async function doSubscribe() {
    const st = state.status;
    state.busy = 'subscribe';
    state.banner = null;
    render();
    try {
      const r = await api('/api/billing/subscribe', { method: 'POST', body: { plan_code: st.plan_code } });

      // En la app de escritorio (Tauri) NO se navega el webview a paypal.com:
      // dejaría al doctor atrapado fuera de la plataforma, sin barra de
      // direcciones ni forma de volver. El pago se abre en el navegador del
      // sistema y aquí se queda el botón "Actualizar estado".
      const tauri = (window.__TAURI__ && window.__TAURI__.core) || null;
      if (tauri && typeof tauri.invoke === 'function') {
        tauri.invoke('plugin:opener|open_url', { url: r.approve_url }).catch(() => {});
        state.busy = '';
        await load();
        banner('info', 'Completa el pago en tu navegador',
          'Abrimos PayPal fuera de la app. Cuando termines, vuelve aquí y pulsa "Actualizar estado".');
        render();
        return;
      }

      // Salimos de la app hacia PayPal; al volver, la página se encarga del resto.
      window.location.href = r.approve_url;
    } catch (err) {
      state.busy = '';
      banner('danger', 'No se pudo iniciar el pago', err.message || 'Intenta de nuevo en unos minutos.');
      render();
    }
  }

  async function doSync() {
    state.busy = 'sync';
    render();
    try {
      await api('/api/billing/sync', { method: 'POST', body: {} });
      await load();
      banner('ok', 'Estado actualizado', 'Los datos se leyeron directamente de PayPal.');
    } catch (err) {
      banner('danger', 'No se pudo actualizar', err.message || 'Intenta de nuevo.');
    }
    state.busy = '';
    render();
  }

  function openCancelModal() {
    const ov = document.createElement('div');
    ov.className = 'sp-ov';
    ov.innerHTML = `
      <div class="sp-dlg" role="dialog" aria-modal="true">
        <h3>¿Cancelar la suscripción?</h3>
        <p>Se detiene la renovación automática en PayPal. Conservas el acceso hasta que
           termine el mes que ya pagaste y tus datos clínicos permanecen intactos.</p>
        <div class="row">
          <button class="keep" id="mdKeep">Seguir suscrito</button>
          <button class="go" id="mdCancel">Sí, cancelar</button>
        </div>
      </div>`;
    document.body.appendChild(ov);

    const close = () => ov.remove();
    ov.addEventListener('click', (ev) => { if (ev.target === ov) close(); });
    ov.querySelector('#mdKeep').onclick = close;
    ov.querySelector('#mdCancel').onclick = async () => {
      close();
      state.busy = 'cancel';
      render();
      try {
        await api('/api/billing/cancel', { method: 'POST', body: { reason: 'Cancelada por el usuario' } });
        await load();
        banner('warn', 'Suscripción cancelada', 'No se harán más cobros. Puedes reactivarla cuando quieras.');
      } catch (err) {
        banner('danger', 'No se pudo cancelar', err.message || 'Intenta de nuevo o hazlo desde tu cuenta de PayPal.');
      }
      state.busy = '';
      render();
    };
  }

  /* ── Carga de datos ── */
  // La API devuelve el modelo agnóstico (plans[], checkout{}, estados en
  // minúscula). Se adapta aquí, en un solo sitio, a los campos que usa el
  // render — así el resto de la página no sabe de procesadores ni de esquemas.
  function adaptar(api) {
    const plan = (api.plans || [])[0] || {};
    const sub = api.subscription;
    return Object.assign({}, api, {
      price: sub && sub.amount != null ? sub.amount : plan.amount || 0,
      currency: (sub && sub.currency) || plan.currency || 'USD',
      plan_name: (sub && sub.plan_name) || plan.name || 'Plan Individual',
      plan_code: (sub && sub.plan_code) || plan.code || 'individual-monthly',
      // Especialidad de la clínica para la lista de funciones. La manda el
      // servidor; el localStorage (que llena layout.js) es solo la red de
      // seguridad por si la respuesta viniera SIN el campo. Cadena vacía del
      // servidor es una respuesta válida ("no la sabemos") y gana al caché.
      specialty: api.specialty != null ? api.specialty : (localStorage.getItem('sd_user_specialty') || ''),
      // Datos del checkout del procesador que toque (hoy PayPal).
      configured: !!api.configured,
      plan_ready: !!(api.checkout && api.checkout.configured),
      client_id: (api.checkout && api.checkout.client_id) || '',
      environment: (api.checkout && api.checkout.environment) || '',
      proveedor: (api.checkout && api.checkout.provider) || 'none',
    });
  }

  async function load() {
    const status = adaptar(await api('/api/billing/status'));
    state.status = status;
    if (status.can_manage) {
      try { state.payments = await api('/api/billing/payments'); } catch (_) { state.payments = []; }
    }
    return status;
  }

  /* ── Regreso desde PayPal ── */
  // PayPal añade ?subscription_id=I-XXXX al return_url. Se confirma contra la API
  // (el servidor comprueba que esa suscripción sea de esta cuenta) y, si PayPal
  // todavía la tiene en "aprobada", se reintenta un par de veces: la activación
  // puede tardar unos segundos.
  async function manejarRegreso(params) {
    const subId = params.get('subscription_id');
    if (!subId) {
      banner('warn', 'El pago no se completó', 'Volviste de PayPal sin terminar la suscripción. Puedes intentarlo de nuevo cuando quieras.');
      return;
    }
    try {
      const r = await api('/api/billing/confirm', { method: 'POST', body: { subscription_id: subId } });
      let activa = r.access && r.access.active;
      for (let intento = 0; !activa && intento < 4; intento++) {
        await new Promise(res => setTimeout(res, 2500));
        try {
          const s = await api('/api/billing/sync', { method: 'POST', body: {} });
          activa = s.access && s.access.active;
        } catch (_) { break; }
      }
      if (activa) {
        const precio = money(state.status ? state.status.price : 19.99, state.status ? state.status.currency : 'USD');
        banner('ok', 'Suscripción activada', 'PayPal cobrará ' + precio + ' cada mes automáticamente. Ya tienes acceso completo a la plataforma.');
      } else {
        banner('warn', 'PayPal aún está confirmando el pago', 'Puede tardar unos minutos. Usa "Actualizar estado" para volver a consultar.');
      }
    } catch (err) {
      banner('danger', 'No se pudo confirmar la suscripción', err.message || 'Consulta el estado con el botón "Actualizar estado".');
    }
  }

  (async function init() {
    const params = new URLSearchParams(window.location.search);
    const flujo = params.get('checkout');
    const bloqueo = params.get('bloqueo') === '1';
    const bienvenida = params.get('bienvenida') === '1';

    try {
      await load();
    } catch (err) {
      ROOT.innerHTML = `<div class="notice danger">${I.alert}<div><b>No se pudo cargar tu suscripción</b>${esc(err.message || 'Revisa tu conexión e intenta de nuevo.')}</div></div>`;
      return;
    }

    if (bienvenida && !state.status.access.active) {
      banner('info', 'Tu cuenta ya está creada',
        'Puedes entrar y recorrer toda la plataforma desde ahora. Para registrar pacientes, citas y consultas, activa la suscripción aquí.');
    } else if (bloqueo && !state.status.access.active) {
      banner('warn', 'Tu cuenta está en modo solo lectura',
        'Mientras la suscripción no esté activa puedes consultar la plataforma, pero no se guardan cambios. Actívala aquí y todo vuelve a funcionar al instante.');
    }
    if (flujo === 'cancel') {
      banner('warn', 'Pago cancelado', 'Saliste de PayPal sin completar la suscripción. No se te ha cobrado nada.');
    }

    render();

    if (flujo === 'return') {
      ROOT.querySelector('.head').insertAdjacentHTML('afterend',
        `<div class="notice in">${I.info}<div><b>Confirmando tu pago con PayPal…</b>Un momento, no cierres esta ventana.</div></div>`);
      await manejarRegreso(params);
      await load().catch(() => {});
      render();
    }

    // La URL se limpia siempre: si el usuario recarga, no se re-dispara el flujo.
    if (flujo || bloqueo || bienvenida) window.history.replaceState({}, '', '/plan.html');
  })();
</script>
