<!-- Bootstrap del tema antes del primer paint. Lee ?theme=dark|light de la
     URL (igual que ortodoncia-design / nutricion-design) y soporta cambios en
     vivo desde el wrapper de la plataforma vía postMessage:
       {type:'fact:theme', theme:'dark'|'light'}  -->
<script>
  (function () {
    try {
      var p = new URLSearchParams(window.location.search);
      var t = p.get('theme');
      if (t !== 'dark' && t !== 'light') t = 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (_) {}
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.type === 'fact:theme' && (d.theme === 'dark' || d.theme === 'light')) {
        document.documentElement.setAttribute('data-theme', d.theme);
      }
    });
  })();
</script>
